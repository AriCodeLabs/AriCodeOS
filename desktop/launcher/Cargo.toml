# The desktop's launcher (ADR 0074 phase C): a package of the desktop
# profile. It lists the installed applications that open a window and
# starts them through the broker's launch endpoint, each with its own
# manifest; leaving it ends the desktop session. Built like `hello_ext`.
[package]
name = "desktop-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The AriCodeOS desktop launcher"
publish = false

[[bin]]
name = "launcher"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-gfx = { path = "../../libs/gfx" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
