# The desktop's terminal (ADR 0074 phase C): a package of the desktop
# profile. It asks init for a session shell of its own, the owner's shell
# as at the console or over SSH, and shows it in a window with the
# console's text grid. Built like `hello_ext`.
[package]
name = "desktop-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The AriCodeOS desktop terminal"
publish = false

[[bin]]
name = "terminal"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-proto = { path = "../../sdk/proto" }
aricode-gfx = { path = "../../libs/gfx" }
aricode-text = { path = "../../libs/text" }
aricode-fb-console = { path = "../../libs/fb-console" }
aricode-sync = { path = "../../libs/sync" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
