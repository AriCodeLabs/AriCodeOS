# bench3d: the graphics benchmark (ADR 0080), a package of the demos profile. Its
# scenes are drawn by libs/render3d on the CPU today; the same scenes are what the GPU
# path will be measured with. Built like `hello_ext`.
[package]
name = "desktop-bench3d"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The AriCodeOS graphics benchmark"
publish = false

[[bin]]
name = "bench3d"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-gfx = { path = "../../libs/gfx" }
aricode-render3d = { path = "../../libs/render3d" }
aricode-sync = { path = "../../libs/sync" }
aricode-text = { path = "../../libs/text" }
aricode-cmdline = { path = "../../libs/cmdline" }
aricode-proto = { path = "../../sdk/proto" }
libm = "=0.2.16"

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
