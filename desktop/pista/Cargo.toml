# Pista: a kart racing game of our own, a package of the desktop profile. Its
# world and renderer are libs/pista, tested on the host. Built like `hello_ext`.
[package]
name = "desktop-pista"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pista, a kart racing game for AriCodeOS"
publish = false

[[bin]]
name = "pista"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-gfx = { path = "../../libs/gfx" }
aricode-pista = { path = "../../libs/pista" }
aricode-proto = { path = "../../sdk/proto" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
