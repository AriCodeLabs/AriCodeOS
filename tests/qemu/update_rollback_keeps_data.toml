# Stage 3 (study F): the new version fails on every boot (init does not
# confirm), AriBoot uses up the three attempts and goes back to A. The data written
# to AriFS before the update is still there after the rollback: A/B protects the
# system and does not touch the data partition.
name = "update.rollback_keeps_data"
description = "three failed boots of B, rollback to A and the AriFS data intact"
level = "full"
areas = ["update", "boot", "init", "shell"]
timeout_secs = 120

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["write notas.txt datos de la version 1", "run updater", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "write: 22 bytes to notas.txt",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC"]

[[boots]]
cmdline = "qemu_exit init_fail_late"
[boots.expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (3 tries)",
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: induced late failure (init_fail_late): slot not confirmed",
    "init exited with code 99",
]
serial_absent = ["KERNEL PANIC", "boot confirmed"]

[[boots]]
cmdline = "qemu_exit init_fail_late"
[boots.expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (2 tries)",
    "slots: booting from slot B (image version 2, pending confirmation)",
    "init exited with code 99",
]
serial_absent = ["KERNEL PANIC", "boot confirmed"]

[[boots]]
cmdline = "qemu_exit init_fail_late"
[boots.expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (1 tries)",
    "slots: booting from slot B (image version 2, pending confirmation)",
    "init exited with code 99",
]
serial_absent = ["KERNEL PANIC", "boot confirmed"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (0 tries)",
    "slots: pending slot exhausted: rollback to active -> slot A",
    "slots: booting from slot A (image version 1)",
    "AriInit: booted from slot A (active)",
    "datos de la version 1",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B", "cat: not found:"]
