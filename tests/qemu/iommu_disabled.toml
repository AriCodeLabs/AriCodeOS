# Phase 34: `iommu=off` boots without DMA translation even when DMAR is present
# (a switch for debugging real hardware). Drivers work the same.
name = "iommu.disabled"
description = "iommu=off with VT-d present: no translation, all boot services up"
level = "full"
areas = ["iommu", "hardware"]
cmdline = "qemu_exit iommu=off"
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "acpi: DMAR 48 bits, 1 unit(s)",
    "iommu: disabled on the command line (iommu=off); untranslated DMA",
    "virtio-blk: device ready",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "translation active", "assigned to domain"]
