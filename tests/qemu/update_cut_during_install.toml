# Stage 3 (study F): power cut while the image is being copied to the inactive
# slot. The runner kills QEMU when it sees the updater has verified the image
# (the copy has just started). The boot state is only written at the end,
# so the next boot stays on A with nothing pending; the updater runs
# again in full and the third boot tries and confirms B.
name = "update.cut_during_install"
description = "power cut during installation: A stays active, the update is repeated and B is confirmed"
level = "full"
areas = ["update", "boot", "init", "shell"]
timeout_secs = 120

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["run updater"]
kill_on = "updater: UPDATE image version 2 verified ("
[boots.expect]
killed = true
serial_contains = ["updater: UPDATE image version 2 verified ("]
serial_absent = ["KERNEL PANIC", "updater: installed into slot"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["run updater", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "slots: state active A, no pending",
    "slots: booting from slot A (image version 1)",
    "updater: installed into slot B",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "no verifica", "boot_slot=B"]

[[boots]]
cmdline = "qemu_exit"
[boots.expect]
exit = 33
serial_contains = [
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: boot confirmed on slot B",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "rechazado"]
