# The owner's remote screen: `screenshot` in a shell asks init, init asks the
# compositor over its main endpoint, and the screen as last composed comes back
# as a QOI image in Base64. Init says each copy, and the desktop shows that it was
# taken. The launcher's endpoint is refused (`apps.launch`).
name = "gui.screenshot"
description = "screenshot: a shell gets the desktop's screen as QOI, said by init and on the desktop"
level = "release"
areas = ["gui", "shell", "init"]
cmdline = "qemu_exit gui shell"
stdin = ["sleep 3000", "screenshot", "shutdown"]
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "screenshot: 1280x800, QOI in Base64 follows",
    "-----BEGIN QOI-----",
    "cW9pZgAABQAAAAMgAw",
    "-----END QOI-----",
    "AriInit: the screen (1280x800) was copied for a shell",
    "compositor: notice: Screen copied for the owner's shell",
    "ARICODEOS_SHUTDOWN",
]
serial_order = [
    "AriInit: the screen (1280x800) was copied for a shell",
    "-----BEGIN QOI-----",
    "-----END QOI-----",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "screen copy refused", "could not be copied"]
