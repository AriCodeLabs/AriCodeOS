# Phase 21: kernel console input. With no input, console_read hits its
# deadline; then the runner sends a line when it sees CONSOLE_INPUT_READY and the
# kernel receives it through the COM1 IRQ.
name = "console.input"
description = "IRQ-driven COM1 receive: expired deadline and reading one line"
level = "full"
areas = ["console", "interrupts"]
cmdline = "qemu_exit test=console_input"
prompt = "CONSOLE_INPUT_READY"
stdin = ["hola AriCodeOS"]

[expect]
exit = 33
serial_contains = [
    "console: input on COM1",
    "console: line 'hola AriCodeOS' (14 bytes, 0 dropped)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
