# The owner's folder home/ (ADR 0074 phase C): only the desktop's editor
# and files may ask for it, and no application named home gets a private
# directory, which would be that folder. Likewise only the desktop's
# settings may ask for `settings`. The three packages are denied and never
# run.
name = "apps.home_rules"
description = "home and settings: only the desktop's own apps get them"
level = "full"
areas = ["apps", "fs"]
cmdline = "qemu_exit shell"
install = ["examples/home_dir", "examples/fake_editor", "examples/fake_settings"]
stdin = ["run home", "run fake_editor", "run fake_settings", "shutdown"]
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "AriInit: denied, no application named home gets a private directory: home/ is the owner's folder",
    "AriInit: denied, requests system capabilities: home",
    "AriInit: denied, requests system capabilities: settings",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "started with what it asked for"]
