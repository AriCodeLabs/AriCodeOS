# Stage 2 (ADR 0014): an AriFS table entry has a corrupted
# byte and its CRC does not match. fsd detects it and refuses to mount; init's
# read-only health check (a list) gets no answer, init does not accept the file
# service and exits with code 14 instead of carrying on with data that cannot
# be trusted (incident 0005: the health check runs before any test client).
name = "filesystem.corrupt_detected"
description = "AriFS with corrupt metadata: fsd does not mount and the boot reflects it"
level = "full"
areas = ["filesystem", "storage", "init"]
cmdline = "qemu_exit"
disk = "fs-corrupt"
timeout_secs = 200

[expect]
exit = 33
serial_contains = [
    "fsd: AriFS corrupt: not mounting",
    "AriInit: file service does not answer a list",
    "init exited with code 14",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "AriFS mounted", "file service ok", "file service answers", "fs_client"]
