# Audit 4836023, finding 1: a USB controller that is not xHCI (EHCI,
# interface 0x20) must not be handed to the xHCI driver nor leave an endpoint without a
# server that would block input_client; the xHCI next to it keeps working.
name = "usb.hid_boot_with_ehci"
description = "boot with EHCI and xHCI: init skips the EHCI by its interface and USB input remains available"
level = "full"
areas = ["usb", "input", "init"]
cmdline = "qemu_exit"
usb_hid = true
usb_legacy_controller = true
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "has no driver (interface 0x20",
    "usb-input: device ready: USB HID Keyboard+Mouse",
    "AriInit: usb_input input ready",
    "input_client: device 2: USB HID Keyboard+Mouse",
    "AriInit: input service ok",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "xHCI initialization failed"]
