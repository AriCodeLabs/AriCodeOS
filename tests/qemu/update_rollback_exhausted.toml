# Phase 30: B pending but with no attempts left: AriBoot rolls back to A
# and clears the pending state.
name = "update.rollback_exhausted"
description = "pending slot exhausted: rollback to the active one"
level = "full"
areas = ["update", "boot"]
cmdline = "qemu_exit"
disk = "b-exhausted"

[expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (0 tries)",
    "slots: pending slot exhausted: rollback to active -> slot A",
    "slots: booting from slot A (image version 1)",
    "AriInit: booted from slot A (active)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B"]
