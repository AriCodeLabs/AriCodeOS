# Phase 30: B installed and pending with 3 attempts. AriBoot consumes one attempt,
# boots B and marks the cmdline; init, with the services running, confirms B
# as active by writing the state through the block service.
name = "update.pending_boot"
description = "first boot of a pending slot and confirmation by init"
level = "full"
areas = ["update", "boot", "init"]
cmdline = "qemu_exit"
disk = "pending-b"

[expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (3 tries)",
    "slots: pending slot with tries left -> slot B",
    "slots: booting from slot B (image version 2, pending confirmation)",
    "cmdline: qemu_exit selftest boot_slot=B boot_pending",
    "AriInit: booted from slot B (pending confirmation)",
    "AriInit: boot confirmed on slot B",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "rechazado", "booting from the ESP"]
