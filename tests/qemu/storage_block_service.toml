# Phase 19: the virtio-blk driver is a resident service; init creates its
# endpoint, launches it with the device capabilities and a client reads and
# writes over IPC with its own DMA buffer (the device writes into it
# directly). The disk has a GPT with an AriCodeOS partition.
name = "storage.block_service"
description = "block service over IPC: GPT, info, zero-copy read/write, clean errors"
level = "full"
areas = ["storage", "virtio", "init"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "virtio-blk: GPT with 5 partition(s)",
    "virtio-blk:   ARI0 LBA 34..6143",
    "virtio-blk: serving requests",
    "blk_client: info, read and write over IPC ok",
    "AriInit: block service ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "initialization failed", "corrupt GPT table", "no GPT"]
