# Stage 1: `services --detail` shows what init's supervisor knows about
# each resident service (state, generation, restarts, last exit).
name = "shell.services_detail"
description = "arish: services --detail queries the supervisor state via the status v1 protocol"
level = "full"
areas = ["services", "shell", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = ["services --detail", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "SERVICE          STATE        GEN  RESTARTS   LAST EXIT         READY FOR",
    "virtio_blk       ready        1    0          -",
    "fsd              ready        1    0          -",
    "virtio_net       ready        1    0          -",
    "virtio_input     ready        1    0          -",
    "console_bridge   ready        1    0          -",
    "(optional)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "init no responde"]
