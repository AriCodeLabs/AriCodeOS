# ADR 0031, EHCI 4.2.2: a full-speed keyboard (usb-kbd with usb_version=1)
# on an ICH9 EHCI with a UHCI companion. After the root port reset the port
# is not enabled (not high speed): usb_ehci must hand the port to a
# companion controller if the EHCI declares one (N_CC), or say that it
# cannot, and never try to enumerate the device itself. The UHCI has no
# driver. QEMU's EHCI-only usb-ehci cannot take a full-speed device at all,
# so this is the only emulated path to the non-high-speed root port case.
name = "usb.ehci_companion"
description = "EHCI driver: a full-speed device on a root port is handed to the companion (or reported), never enumerated"
level = "full"
areas = ["usb", "init"]
cmdline = "qemu_exit"
usb_ehci_companion_kbd = true
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "usb-ehci: EHCI ready (",
    "usb-ehci: port 1: full-speed device ",
    "usb-ehci: device ready: EHCI HID (no devices)",
    "has no driver (interface 0x00",
    "AriInit: usb_ehci input ready",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "transfer to address", "EHCI initialization failed"]
