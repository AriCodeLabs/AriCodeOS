# Phase 30: the updater (a trusted application with the block capability) reads the
# UPDATE image (version 2), verifies it, copies it to the inactive slot (B) and
# leaves B pending with 3 attempts. An `updater` launched without a trusted
# manifest would not get the block service.
name = "update.apply"
description = "updater: verify UPDATE, install into the inactive slot and schedule the boot"
level = "full"
areas = ["update", "sandbox", "shell"]
cmdline = "qemu_exit shell"
timeout_secs = 120
stdin = ["run updater", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "AriInit: launch updater with manifest [system fs net block] memory 6144 KiB",
    "updater: UPDATE image version 2 verified (",
    "updater: installed into slot B",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "run: updater exited with 0",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "no verifica", "denied"]
