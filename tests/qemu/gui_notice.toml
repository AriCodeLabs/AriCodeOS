# A notice from the compositor (ADR 0078, stage 3): what it says of a hot processor cannot
# be provoked in a test, so `gui_notice` shows one as it starts. It stays 8 s and goes.
name = "gui.notice"
description = "a notice shows under the bar and goes by itself"
level = "release"
areas = ["gui"]
cmdline = "qemu_exit gui shell gui_notice"
stdin = ["sleep 10000", "shutdown"]
timeout_secs = 60

[host_input]
marker = "compositor: notice: Hot: 95 C"
wait_ms = 400
screendump = "notice"

[expect]
exit = 33
serial_contains = ["compositor: notice: Hot: 95 C", "compositor: notice gone", "ARICODEOS_SHUTDOWN"]
serial_order = ["compositor: notice: Hot: 95 C", "compositor: notice gone"]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW"]
