# Audit 3eb4965, finding 1: with several CPUs, the waiting CPU could
# retire the process before the reaping CPU had freed its address space, and
# frames were leaked. Batches of processes on 4 CPUs with frame accounting.
name = "smp.process_reap"
description = "test=process_reap with -smp 4: reap and wait on different CPUs without leaking frames"
level = "full"
areas = ["smp", "user", "memory"]
cmdline = "qemu_exit test=process_reap"
cpus = 4
# 180 processes with the screen console scrolling: between 20 and 50 s under
# TCG depending on host load.
timeout_secs = 120

[expect]
exit = 33
serial_contains = ["smp: 4 CPUs online", "process reap selftest ok (180 processes created and waited for on 4 CPU(s)", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "frames perdidos"]
