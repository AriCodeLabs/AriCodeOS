# Phase 21: init launches the shell (cmdline `shell`) after the boot
# services; the runner types commands when it sees the prompt and ends with shutdown,
# which the kernel turns into a clean QEMU exit.
name = "shell.commands"
description = "arish: help, uptime, mem, ps, ls, cat, devices, services, net, ping, dns, error and shutdown"
level = "full"
areas = ["shell", "filesystem", "network", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = [
    "help",
    "uptime",
    "mem",
    "ps",
    "ls",
    "cat hola.txt",
    "cat no-existe",
    "devices",
    "services",
    "net",
    "ping 10.0.2.2",
    "dns aricodeos.test",
    "http http://10.0.2.2:17010/hola",
    "run hello_app 7",
    "run no-existe",
    "nada",
    "l1981",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "arish: AriCodeOS shell",
    "ari> help",
    "  shutdown  power off",
    "uptime: ",
    "usable physical memory: ",
    "PID  STATE       NAME",
    "shell",
    "hola.txt            17 bytes",
    "ari> cat hola.txt",
    "Hola desde AriFS",
    "cat: not found: no-existe",
    "1af4:1042  class 01.00",
    "files     fsd         active, responding",
    "network   service     active",
    "link    up",
    "ip      10.0.2.15",
    "reply from 10.0.2.2: seq=4 time=",
    "4 of 4 replies",
    "HTTP 200, 19 bytes",
    "Hola desde el host",
    "hello_app: hello from an SDK app (arg 7)",
    "hello_app: 6 handles",
    "hello_app: uptime ",
    "run: hello_app exited with 0",
    "run: no-existe: not found in the initrd",
    "unknown command: nada (help)",
    "8f404d2264f6e48a55d552bd1139211707c3dbd502cf918ff1338299940d075a6679eddd5dc069a384607c0cc822ca121d913c6e970a3902edf499e2d30e31ff",
    "AriCodeOS: shutting down",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "ARICODEOS_KERNEL_READY"]
