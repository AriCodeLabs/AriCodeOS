# Phase 26: with `gui` the kernel hands over the framebuffer; init launches the compositor
# with the virtio inputs, and the shell starts the test package `gui_demo` twice
# (ADR 0074) so two applications paint at the same time. The host
# moves the mouse over window B, clicks (focus) and types 'h': only B
# receives the key. `gui_trace` makes the compositor log every frame with
# one pixel sample per window (without it frames print nothing,
# gui.frames_untraced); the first frame flushes the whole 1280x800 screen.
# Each application has its own compositor session (ADR 0052): B cannot poll,
# present or close A's window, nor make or end sessions, and the window B
# leaves open closes when B is gone.
name = "gui.two_windows"
description = "ring 3 compositor: two isolated windows, click-to-focus and routed keyboard"
level = "full"
areas = ["gui", "input", "init"]
cmdline = "qemu_exit gui gui_trace shell"
install = ["examples/gui_demo"]
# Demo A waits 3 s without events after B is gone, then closes its window.
stdin = ["spawn gui_demo 0", "run gui_demo 1", "sleep 5000", "shutdown"]
timeout_secs = 120

[host_input]
marker = "compositor: desktop ready with 2 windows"
mouse_rel = [-180, -20]
click = "left"
keys = ["h"]

[expect]
exit = 33
serial_contains = [
    "framebuffer: 1280x800 stride 1280 Bgr @ 0x80000000 (reserved for the compositor)",
    "compositor: screen 1280x800",
    "compositor: gui_trace: logging every frame",
    "flushed 1024000 px in 1 rect(s)",
    "compositor: window 1 'Demo A' 400x300",
    "compositor: window 2 'Demo B' 400x300",
    "gui_demo A: window presented",
    "gui_demo B: window presented",
    "compositor: window 1 sample (50,70) = 0xc04040",
    "compositor: window 2 sample (90,110) = 0x4080c0",
    "compositor: desktop ready with 2 windows",
    "gui_demo A: focus gained",
    "gui_demo A: focus lost",
    "gui_demo B: focus gained",
    "gui_demo B: click button 1 at (380,280)",
    "gui_demo B: key 'h'",
    "gui_demo A: no keys",
    "gui_demo B: the other window is out of reach",
    "gui_demo B: leaving without closing its window",
    "compositor: client 2 gone: 1 window(s) closed",
    "gui_demo A: window closed",
    "compositor: client 1 gone: 0 window(s) closed",
    "AriInit: gui ok (compositor started)",
    "AriInit: launch gui_demo from AriFS (apps/gui_demo.aripkg version 1",
    "[host] QMP: 6 input events sent",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = [
    "KERNEL PANIC",
    "USER STACK OVERFLOW",
    "gui_demo A: key",
    "reached a window that is not its own",
    "made or ended a session",
]
# A new window takes the focus (ADR 0074 phase C): A has it until B
# opens. Window 1 is still open when B tries it, and B's window is
# reclaimed before A closes its own.
serial_order = [
    "gui_demo A: focus gained",
    "gui_demo A: focus lost",
    "gui_demo B: the other window is out of reach",
    "compositor: client 2 gone: 1 window(s) closed",
    "gui_demo A: window closed",
    "compositor: client 1 gone: 0 window(s) closed",
]
