# Fase 26: con `gui` el kernel cede el framebuffer; init lanza el compositor
# con las entradas virtio y dos aplicaciones que pintan a la vez. El host
# mueve el raton sobre la ventana B, hace clic (foco) y teclea 'h': solo B
# recibe la tecla.
name = "gui.two_windows"
description = "compositor en ring 3: dos ventanas aisladas, foco por clic y teclado enrutado"
level = "full"
areas = ["gui", "input", "init"]
cmdline = "qemu_exit gui"
timeout_secs = 120

[host_input]
marker = "compositor: escritorio listo con 2 ventanas"
mouse_rel = [-180, -20]
click = "left"
keys = ["h"]

[expect]
exit = 33
serial_contains = [
    "framebuffer: 1280x800 stride 1280 Bgr @ 0x80000000 (reservado para el compositor)",
    "compositor: pantalla 1280x800",
    "compositor: ventana 1 'Demo A' 400x300",
    "compositor: ventana 2 'Demo B' 400x300",
    "gui_demo A: ventana presentada",
    "gui_demo B: ventana presentada",
    "compositor: ventana 1 muestra (50,70) = 0xc04040",
    "compositor: ventana 2 muestra (90,110) = 0x4080c0",
    "compositor: escritorio listo con 2 ventanas",
    "gui_demo B: foco ganado",
    "gui_demo B: clic boton 1 en (380,280)",
    "gui_demo B: tecla 'h'",
    "gui_demo A: sin teclas",
    "AriInit: gui ok (2 aplicaciones)",
    "[host] QMP: 6 eventos de entrada enviados",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "gui_demo A: tecla", "gui_demo A: foco ganado"]
