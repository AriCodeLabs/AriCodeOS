name = "memory.heap_init"
description = "kernel heap mapped and announced"
level = "smoke"
areas = ["memory"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = ["[INFO ] heap: 1024 KiB at 0xffffc00000000000, grows in 1024 KiB chunks up to 64 MiB", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC"]
