# AriFS table nearly full (re-audit, R3): only four of the 32 entries are
# free when the machine boots with a registered source. A first `update`
# and a system `upgrade` create exactly four files in the updater's
# directory (state, indexes, last.log, history.log), so both succeed and
# the table ends full.
name = "update.fs_nearly_full"
description = "update and upgrade fit in an AriFS table with four free entries"
level = "full"
areas = ["update", "network", "shell", "filesystem"]
disk = "fs-nearly-full"
timeout_secs = 180

[host_update]
system = 2

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update", "upgrade", "ls", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "updater: source 1 http://10.0.2.2:17010/update/: index verified (serial ",
    "updater: system: installed 1, source 1 offers 2: upgrade available",
    "updater: installed into slot B",
    "updater: system 2 installed: reboot to apply",
    "32 file(s)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "update: updater exited with", "update: installer exited", "cannot store", "cannot save", "cannot write", "upd-indexes-damaged"]
