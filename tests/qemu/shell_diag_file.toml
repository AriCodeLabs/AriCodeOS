# Phase 34: `diag NAME` saves the report in AriFS so it can be read from the
# host with `cargo xtask fs-cat` (laptop diagnostics without photos).
name = "shell.diag_file"
description = "arish: diag NAME writes the full report to AriFS and cat reads it back"
level = "full"
areas = ["shell", "filesystem"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = ["diag diag.txt", "ls", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "=== AriCodeOS diagnostics ===",
    "PID  STATE       NAME",
    "1af4:1042 class 01.00",
    "=== end of diagnostics ===",
    "bytes to diag.txt",
    "diag.txt",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "diag: no se pudo guardar"]
