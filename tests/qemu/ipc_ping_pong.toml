# Phase 14: two user processes communicate through an endpoint created by the
# kernel: 1000 round trips transferring a reply handle with each
# message, plus timeout, bounded queue, failed send without losing capabilities,
# oversized message and handle without TRANSFER.
name = "ipc.ping_pong"
description = "test=ipc: server and client in ring 3, 1000 round trips, timeouts and bounded queue"
level = "full"
areas = ["ipc", "capabilities", "user"]
cmdline = "qemu_exit test=ipc"
timeout_secs = 40

[expect]
exit = 33
serial_contains = ["ipc selftest ok: 1000 round trips", "TSC cycles per round trip", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "USER FAULT"]
