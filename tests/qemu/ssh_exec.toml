# SSH (ADR 0025): the runner generates a client key, installs it as
# authorized_keys in AriFS and, once sshd listens, runs commands with the
# host's OpenSSH client through the forwarded port. Each command runs in a
# quiet session shell launched by init; the last one powers the machine off
# from the remote session. An idle TCP client connects first and never
# identifies itself: sshd drops it after its authentication deadline and
# then serves the real client. `run console_probe` checks ADR 0047: a
# program run from a session writes to the session (its lines arrive with
# the `[host] ssh|` prefix and never alone on the machine's console), and an
# empty write does not end the session; `run console_probe 3000` sends
# 300 KB through sshd's flow control and the last line arrives whole.
name = "ssh.exec"
description = "sshd: public-key login from the host's OpenSSH client, commands in session shells, shutdown over SSH"
level = "full"
areas = ["ssh", "network", "shell"]
cmdline = "qemu_exit shell"
timeout_secs = 200

[host_ssh]
marker = "sshd: listening on port 22"
commands = ["ls", "cat hola.txt", "write remote.txt written over ssh", "cat remote.txt", "update", "run console_probe", "run console_probe 3000", "shutdown"]
idle_client = true

[expect]
exit = 33
serial_contains = [
    "sshd: fault ssh entropy weak: kernel generator seeded from TSC + interrupts (",
    "sshd: new host key generated and saved",
    "[host] ssh idle client connected",
    "sshd: authentication timeout from 10.0.2.2",
    "1 authorized key(s)",
    "sshd: user 'ari' authenticated from 10.0.2.2",
    "[host] ssh $ ls",
    "[host] ssh| hola.txt",
    "[host] ssh| authorized_keys",
    "[host] ssh| Hola desde AriFS",
    "[host] ssh| write: 17 bytes to remote.txt",
    "[host] ssh| written over ssh",
    "[host] ssh| updater: no update sources: update add URL",
    "[host] ssh| update: updater exited with 21",
    "[host] ssh| console probe: checks passed",
    "[host] ssh| console probe: still writing after an empty write",
    "[host] ssh| run: console_probe exited with 0",
    "[host] ssh| console probe 3000 ......",
    "[host] ssh exit 0",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "connection dropped", "Permission denied", "sshd: refused key", "\nconsole probe:", "\nupdater: no update sources"]
