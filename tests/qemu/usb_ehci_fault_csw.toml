# ADR 0028/0031: a real halt on the EHCI bulk IN endpoint. `usb_fault=idle:csw`
# makes usb_ehci read a CSW with no command outstanding on the first block
# request after two idle seconds; the emulated stick answers with a STALL,
# which halts the queue head. The driver clears it with
# CLEAR_FEATURE(ENDPOINT_HALT) (USB 2.0 9.4.5), reads the CSW once more
# (BOT 6.7.2), and when that stalls too runs the Reset Recovery (BOT
# 5.3.4). The request answers Io; the next write succeeds.
name = "usb.ehci_fault_csw"
description = "EHCI driver: a real STALL on bulk IN is cleared per USB 2.0/BOT, the request answers Io and the next one succeeds"
level = "full"
areas = ["usb", "storage", "diag"]
usb_ehci_storage = true
cmdline = "qemu_exit shell usb_fault=idle:csw"
timeout_secs = 120
stdin = [
    "repeat 10 ping 10.0.2.2",
    "write probe.txt after idle",
    "repeat 3 ping 10.0.2.2",
    "write probe.txt second try",
    "diag",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "usb-ehci: injected fault: reading a CSW with no command outstanding",
    "usb-ehci: CSW stage of tag ",
    "usb-ehci: bulk in transfer to address 1 endpoint ",
    "failed: STALL (token ",
    "usb-ehci: Reset Recovery (BOT 5.3.4): mass storage reset, both bulk halts cleared",
    "usb-ehci: Reset Recovery done; transport ready",
    "write: write error",
    "write: 11 bytes to probe.txt",
    "fault reported by process",
    "ehci bulk in stall",
    "usb inj w lba",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "strict", "storage unusable", "queue head lost"]
