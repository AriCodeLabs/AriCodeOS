# Stage 4 (ADR 0019): an ill-typed module (add with an empty stack) is
# rejected during validation, before instantiating it or executing a single
# instruction.
name = "wasm.invalid"
description = "invalid WASM module: the validator rejects it before running"
level = "full"
areas = ["wasm", "sandbox", "shell"]
cmdline = "qemu_exit shell"
disk = "wasm-invalid"
timeout_secs = 90
stdin = ["run wasm_runner 5", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "wasm_runner: invalid module (empty stack)",
    "run: wasm_runner exited with 6",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "wasm: hola", "module failed", "trap"]
