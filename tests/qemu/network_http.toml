# Fase 24: primera aplicacion de red. GET contra el servidor HTTP de pruebas
# del host: Content-Length, chunked, 404 y puerto cerrado.
name = "network.http"
description = "cliente HTTP GET sobre TCP por IPC"
level = "full"
areas = ["network", "init"]
cmdline = "qemu_exit"
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "http_client: GET /hola -> 200, 19 bytes: Hola desde el host",
    "http_client: GET /chunked -> 200 (chunked) ok",
    "http_client: GET /no-existe -> 404",
    "http_client: puerto cerrado detectado",
    "http_client: HTTP GET por TCP ok",
    "AriInit: cliente HTTP ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW"]
