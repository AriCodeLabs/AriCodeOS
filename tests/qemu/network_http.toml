# Phase 24: first network application. GET against the host test HTTP
# server: Content-Length, chunked, 404 and closed port.
name = "network.http"
description = "HTTP GET client over TCP via IPC"
level = "full"
areas = ["network", "init"]
cmdline = "qemu_exit"
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "http_client: GET /hola -> 200, 19 bytes: Hola desde el host",
    "http_client: GET /chunked -> 200 (chunked) ok",
    "http_client: GET /no-existe -> 404",
    "http_client: closed port detected",
    "http_client: HTTP GET over TCP ok",
    "AriInit: HTTP client ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW"]
