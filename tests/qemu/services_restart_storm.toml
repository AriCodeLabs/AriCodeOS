# Stage 1 (observable recovery): a test service that dies after
# every request is restarted 100 times under init's supervisor, with bounded
# increasing backoff, while fsd keeps responding; free memory returns
# to its previous level (the endpoint belongs to init and survives every generation).
name = "services.restart_storm"
description = "restart_storm: 100 supervised restarts of crashy_service without leaking frames and with fsd responding"
level = "full"
areas = ["services", "init", "user"]
cmdline = "qemu_exit restart_storm"
timeout_secs = 120

[expect]
exit = 33
serial_contains = [
    "AriInit: service crashy_service died from a fault; restart in",
    "AriInit: service crashy_service restarted (generation 101)",
    "AriInit: supervisor: 100 restarts of crashy_service in",
    "fsd answered 10/10",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "se han perdido frames", "restart budget exhausted"]
