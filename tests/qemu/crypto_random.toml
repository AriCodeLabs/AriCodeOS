# Phase 31: the kernel seeds a ChaCha20 generator from rdrand or the TSC and serves
# random bytes; two consecutive reads are different and non-zero.
name = "crypto.random"
description = "kernel random generator: seed, announced source and distinct reads"
level = "full"
areas = ["crypto"]
cmdline = "qemu_exit test=random"

[expect]
exit = 33
serial_contains = [
    "random: ChaCha20 generator seeded with",
    "random: source",
    "interrupt stirs, sample",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
