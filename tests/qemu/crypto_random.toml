# Fase 31: el kernel siembra un generador ChaCha20 con rdrand o TSC y sirve
# bytes aleatorios; dos lecturas seguidas son distintas y no nulas.
name = "crypto.random"
description = "generador aleatorio del kernel: semilla, fuente anunciada y lecturas distintas"
level = "full"
areas = ["crypto"]
cmdline = "qemu_exit test=random"

[expect]
exit = 33
serial_contains = [
    "random: generador ChaCha20 sembrado con",
    "random: fuente",
    "ok, muestra",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
