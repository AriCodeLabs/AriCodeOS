# Phase 29 and stage 4 (ADR 0019): wasm_runner (an application with a
# system+fs manifest) loads demo.wasm and demo.manifest from its private directory, validates
# the module and runs it with aricode-wasm; the module, compiled with rustc for
# wasm32, only uses the Capability API its manifest grants it (print,
# clock, files) and writes and re-reads a file.
name = "wasm.demo"
description = "WebAssembly runtime in ring 3: isolated portable module with the Capability API"
level = "full"
areas = ["wasm", "sandbox", "shell"]
cmdline = "qemu_exit shell"
timeout_secs = 90
stdin = ["run wasm_runner 5", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "AriInit: launch wasm_runner with manifest [system fs] memory 512 KiB",
    "wasm_runner: module demo.wasm loaded (",
    "wasm: hello from WebAssembly (arg 5)",
    "wasm: fib(24) = 46368",
    "wasm: uptime ",
    "wasm: weighted sum 162",
    "wasm: file 'notas' written and read (18 bytes)",
    "wasm_runner: module manifest: print clock files",
    "wasm_runner: main returned 42",
    "run: wasm_runner exited with 42",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "module failed", "unknown import"]
