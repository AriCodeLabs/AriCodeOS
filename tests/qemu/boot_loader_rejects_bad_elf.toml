# Fault injection: truncated kernel.elf. AriBoot must reject it and exit with failure.
name = "boot.loader_rejects_bad_elf"
description = "truncated kernel.elf -> AriBoot reports an invalid ELF, without jumping"
level = "full"
areas = ["boot"]
cmdline = "qemu_exit"

# No slots: these scenarios exercise the ESP path.
disk = "esp-only"

[inject]
truncate_kernel = 3000

[expect]
exit = 35
serial_contains = ["kernel.elf: invalid ELF64"]
serial_absent = ["AriCodeOS booting...", "ARICODEOS_KERNEL_READY"]
