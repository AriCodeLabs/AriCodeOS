# Fase 22: netd (virtio-net en ring 3) obtiene direccion por DHCP de la red
# de usuario de QEMU, responde ARP, hace ping al router, intercambia UDP y
# resuelve un nombre contra el respondedor de pruebas del host.
name = "network.stack"
description = "virtio-net + DHCP + ARP + ICMP + UDP + DNS por IPC"
level = "full"
areas = ["network", "virtio", "init"]
cmdline = "qemu_exit"
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "virtio-net: dispositivo listo, MAC ",
    "virtio-net: sirviendo peticiones",
    "virtio-net: DHCP 10.0.2.15 mascara 255.255.255.0 router 10.0.2.2 dns 10.0.2.3",
    "net_client: ip 10.0.2.15 router 10.0.2.2 dns 10.0.2.3",
    "net_client: respuesta de 10.0.2.2 seq 1 rtt ",
    "net_client: respuesta de 10.0.2.2 seq 2 rtt ",
    "net_client: eco UDP recibido de 10.0.2.2 puerto 17007",
    "net_client: aricodeos.test -> 10.1.2.3",
    "net_client: DHCP, ping, UDP y DNS por IPC ok",
    "AriInit: servicio de red ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "fallo en la inicializacion", "USER STACK OVERFLOW"]
