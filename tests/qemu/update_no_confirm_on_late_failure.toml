# Audit e9fdf38, finding 3: init only confirms the pending slot when
# all boot services have worked. With `init_fail_late` init
# fails at the end: the state must stay pending (2 attempts, one consumed
# by AriBoot) and no confirmation must appear.
name = "update.no_confirm_on_late_failure"
description = "a late init failure does not confirm the pending slot"
level = "full"
areas = ["update", "init"]
cmdline = "qemu_exit init_fail_late"
disk = "pending-b"

[expect]
exit = 33
serial_contains = [
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: induced late failure (init_fail_late): slot not confirmed",
    "AriInit: boot state: active A, pending B (2 tries)",
    "init exited with code 99",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot confirmed"]
