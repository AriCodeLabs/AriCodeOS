# Audit 2026-10-25 C, M4: an input driver has one place for a waiting read.
# A reader that died with its read waiting kept that place (an unbounded
# timeout: for good), and the first events to arrive were taken from the
# queue and sent to the dead reader: lost. Here a reader starts a read on
# each input service and dies before the console bridge starts; the host
# then types, each key waiting for the shell's echo of the previous one, so
# a lost key stops the scenario.
name = "input.orphan_read"
description = "input: a reader dies with its read waiting; the keys typed next still reach the shell through the console bridge"
level = "full"
areas = ["input", "console", "virtio"]
cmdline = "qemu_exit shell input_orphan"
timeout_secs = 60

[host_input]
marker = "CONSOLE_BRIDGE_READY"
echo_prompt = "ari> "
keys = ["c", "p", "u", "s", "ret", "s", "h", "u", "t", "d", "o", "w", "n", "ret"]

[expect]
exit = 33
serial_contains = [
    "input_orphan: read started; exiting with it waiting",
    "AriInit: console bridge with 2 input device(s)",
    "cpus: ",
    "ari> shutdown",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "input_orphan failed", "console-bridge: console rejects input"]
