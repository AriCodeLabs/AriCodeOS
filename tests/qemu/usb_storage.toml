# Phase 34 (ADR 0023): the test disk is a USB stick (usb-storage on
# the xHCI) and there is no virtio-blk. usbd enumerates it as bulk-only mass
# storage, serves it with the block protocol, init mounts fsd on top and
# the shell writes a file that survives a reboot (SYNCHRONIZE CACHE
# on AriFS flush).
name = "usb.storage"
description = "USB stick as block service: fsd and shell on top of usbd, durable write"
level = "full"
areas = ["usb", "storage", "filesystem", "init", "shell"]
usb_storage = true
timeout_secs = 90

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["ls", "write notas.txt hola usb", "cat notas.txt", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "AriInit: no virtio-blk",
    "usb-input: storage device 46f4:0001 bcdUSB ",
    "speed 4 (super)",
    "usb-input: USB storage on port",
    "usb-input: device ready: USB HID (no devices)",
    "AriInit: block service via USB (",
    "AriInit: file service ok",
    "AriInit: block service ok",
    "arish: AriCodeOS shell",
    "hola.txt",
    "write: 9 bytes to notas.txt",
    "hola usb",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "write: error", "xHCI initialization failed"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "AriInit: block service via USB (",
    "hola usb",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC"]
