# Stage 4 (ADR 0019): the module manifest only grants `print`; the
# runner rejects the clock import before running anything. Whatever the
# manifest does not grant does not exist for the module, even if the runner has it.
name = "wasm.restricted"
description = "WASM module with a restricted manifest: import not granted, not run"
level = "full"
areas = ["wasm", "sandbox", "shell"]
cmdline = "qemu_exit shell"
disk = "wasm-restricted"
timeout_secs = 90
stdin = ["run wasm_runner 5", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "wasm_runner: module manifest: print",
    "wasm_runner: import aricode.uptime_ms not granted by the module manifest",
    "run: wasm_runner exited with 12",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "wasm: hola", "module failed"]
