# #BP es recuperable: el handler avisa y el kernel sigue hasta READY.
name = "interrupts.breakpoint_returns"
description = "test=breakpoint -> #BP manejado, la ejecucion continua"
level = "smoke"
areas = ["interrupts"]
cmdline = "qemu_exit test=breakpoint"

[expect]
exit = 33
serial_contains = ["cpu: GDT, TSS (IST para #DF) e IDT instaladas", "[WARN ] #BP breakpoint en rip=0xffffffff8", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "EXCEPTION"]
