# Which machine a report came from (sysinfo::MACHINE): the make and model from
# SMBIOS (in the legacy area or, on UEFI, the firmware's own memory), and the
# device identifiers in the ACPI tables, found without an AML interpreter. On
# QEMU's q35 the PCI Express root bridge is PNP0A08, compatible with PNP0A03.
# The `power` lines carry the FADT's power-off facts (incident 0065): QEMU's
# q35 has its PM1 blocks at 0x600 and is in ACPI mode (SCI_EN 1).
# `acpidump` saves the DSDT and SSDTs for a device study.
name = "diag.machine"
description = "diag names the machine and the ACPI device identifiers; acpidump saves the AML"
level = "smoke"
areas = ["diag", "shell"]
cmdline = "qemu_exit shell"
timeout_secs = 120
stdin = ["diag", "acpidump acpi.bin", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "machine QEMU Standard PC",
    "SMBIOS 2.8 in firmware memory",
    "PNP0A08 PNP0A03",
    "power   FADT rev ",
    "hardware-reduced 0",
    "power   S5 SLP_TYP 0/0; PM1a evt 0x600",
    "power   now: PM1a control 0x0001 (SCI_EN 1)",
    "SMI on SLP_EN not read (chipset not in the table)",
    "=== end of diagnostics ===",
    " bytes to acpi.bin",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "acpi    no device identifiers found"]
