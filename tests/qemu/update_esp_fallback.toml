# Phase 30: disk without slot partitions: AriBoot boots from the ESP as
# recovery and init logs it.
name = "update.esp_fallback"
description = "no ARIBOOT: recovery boot from the ESP"
level = "full"
areas = ["update", "boot"]
cmdline = "qemu_exit"
disk = "esp-only"

[expect]
exit = 33
serial_contains = [
    "slots: no ARIBOOT partition, booting from the ESP",
    "AriInit: booted from the ESP (no slots)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot="]
