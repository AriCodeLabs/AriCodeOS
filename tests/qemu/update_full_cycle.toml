# Stage 3 (update across boots, study F): with the same disk, the
# updater installs B, the machine reboots, AriBoot boots the pending B,
# init confirms it, and the third boot already comes from B as active. A file
# written before the update is still there on every boot.
name = "update.full_cycle"
description = "install B, reboot, confirm B and boot from the active B while keeping the AriFS data"
level = "full"
areas = ["update", "boot", "init", "shell"]
timeout_secs = 120

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["write notas.txt antes de actualizar", "run updater", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "slots: state active A, no pending",
    "write: 20 bytes to notas.txt",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "no verifica"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "slots: state active A, pending B (3 tries)",
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: boot confirmed on slot B",
    "antes de actualizar",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "rollback", "cat: not found:"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "slots: state active B, no pending",
    "slots: booting from slot B (image version 2)",
    "AriInit: booted from slot B (active)",
    "antes de actualizar",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "pending confirmation", "cat: not found:"]
