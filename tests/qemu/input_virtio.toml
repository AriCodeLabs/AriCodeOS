# Phase 25: one inputd per virtio-input device. The host injects over QMP
# the line "hola" + Enter on the keyboard and a move and click on the mouse;
# input_client translates them with the US keyboard layout from libs/input.
name = "input.virtio"
description = "virtio-input: keyboard and mouse over IPC with events injected via QMP"
level = "full"
areas = ["input", "virtio", "init"]
cmdline = "qemu_exit"
timeout_secs = 90

[host_input]
marker = "INPUT_READY"
keys = ["h", "o", "l", "a", "ret"]
mouse_rel = [10, -5]
click = "left"

[expect]
exit = 33
serial_contains = [
    "virtio-input: device ready: QEMU Virtio Keyboard",
    "virtio-input: device ready: QEMU Virtio Mouse",
    "input_client: device 0: QEMU Virtio Keyboard",
    "input_client: device 1: QEMU Virtio Mouse",
    "input_client: keyboard: hola",
    "input_client: mouse: left button pressed",
    "input_client: mouse: dx=10 dy=-5",
    "input_client: input events over IPC ok",
    "[host] QMP: 14 input events sent",
    "AriInit: input service ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "nobody typed", "initialization failed"]
