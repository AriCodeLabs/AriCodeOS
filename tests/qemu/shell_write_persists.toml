# Stage 2 (useful session): write a file from the shell, reboot with the
# same disk and read it again. `[[boots]]` keeps the test disk across
# boots; the replace is atomic and durable (ADR 0014).
name = "shell.write_persists"
description = "arish: write creates or replaces a file and its content survives a reboot"
level = "full"
areas = ["shell", "filesystem", "storage"]
timeout_secs = 60

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["write notas.txt hola persistente", "cat notas.txt", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "write: 17 bytes to notas.txt",
    "hola persistente",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "write: error"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "fsd: AriFS mounted, 6 files",
    "fs_client: nuevo.txt already existed (persistent disk)",
    "hola persistente",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "cat: not found:"]
