# Etapa 2 (sesion util): escribir un fichero desde el shell, reiniciar con el
# mismo disco y volver a leerlo. `[[boots]]` conserva el disco de pruebas entre
# arranques; el reemplazo es atomico y duradero (ADR 0014).
name = "shell.write_persists"
description = "arish: write crea o reemplaza un fichero y su contenido sobrevive a un reinicio"
level = "full"
areas = ["shell", "filesystem", "storage"]
timeout_secs = 60

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["write notas.txt hola persistente", "cat notas.txt", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "write: 17 bytes en notas.txt",
    "hola persistente",
    "AriCodeOS: reiniciando",
]
serial_absent = ["KERNEL PANIC", "write: error"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["cat notas.txt", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "fsd: AriFS montado, 6 ficheros",
    "fs_client: nuevo.txt ya existia (disco persistente)",
    "hola persistente",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "cat: no existe"]
