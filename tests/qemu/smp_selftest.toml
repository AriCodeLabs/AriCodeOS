# Phase 32: SMP self-test with 4 CPUs: affinity and real parallelism, thread
# migration, TLB shootdown observed from another CPU and a contended lock.
name = "smp.selftest"
description = "test=smp with -smp 4: affinity, parallelism, migration, TLB shootdown and contended locks"
level = "full"
areas = ["smp", "scheduler", "threads"]
cmdline = "qemu_exit test=smp"
cpus = 4
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "smp: 4 CPUs online",
    "smp selftest ok (4 CPUs:",
    "shootdown seen by CPU 1 (3 IPI)",
    "every CPU reached in",
    "counter 80000)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
