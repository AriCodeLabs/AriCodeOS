# With the stack pointing at unmapped memory, only the IST stack lets the
# #DF handler actually run and leave diagnostics.
name = "interrupts.double_fault_uses_ist"
description = "test=double_fault -> #DF handled on the IST stack"
level = "full"
areas = ["interrupts"]
cmdline = "qemu_exit test=double_fault"

[expect]
exit = 35
serial_contains = ["EXCEPTION #DF (8) Double Fault", "ERROR: 0x0", "ARICODEOS KERNEL PANIC"]
serial_absent = ["ARICODEOS_KERNEL_READY"]
