# Phase 30: the pending B image carries a tampered signature: AriBoot
# rejects it, discards the pending state and boots A.
name = "update.reject_bad_signature"
description = "image with an invalid signature: rejection and rollback"
level = "full"
areas = ["update", "boot", "crypto"]
cmdline = "qemu_exit"
disk = "b-corrupt"

[expect]
exit = 33
serial_contains = [
    "slots: slot B rejected: invalid signature",
    "slots: pending slot image rejected: rollback to active -> slot A",
    "slots: booting from slot A (image version 1)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B"]
