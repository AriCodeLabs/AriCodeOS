# Fase 30: la imagen de B pendiente lleva una firma alterada: AriBoot la
# rechaza, descarta el pendiente y arranca A.
name = "update.reject_bad_signature"
description = "imagen con firma invalida: rechazo y rollback"
level = "full"
areas = ["update", "boot", "crypto"]
cmdline = "qemu_exit"
disk = "b-corrupt"

[expect]
exit = 33
serial_contains = [
    "slots: slot B rechazado: firma invalida",
    "slots: imagen del slot pendiente rechazada: rollback al activo -> slot A",
    "slots: arrancando desde el slot A (imagen version 1)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B"]
