# Phase 32: with 4 CPUs user processes are spread across them: the
# shell, the services and the applications launched by the broker work
# the same (syscalls, IPC, user exceptions and clean exit).
name = "smp.shell_user"
description = "-smp 4 with shell: cpus, ps, running applications and a dying process, all in parallel"
level = "full"
areas = ["smp", "shell", "user", "init"]
cmdline = "qemu_exit shell"
cpus = 4
timeout_secs = 120
stdin = [
    "cpus",
    "uptime",
    "run hello_app 7",
    "repeat 20 run hello_app 8",
    "run perms_check",
    "run fs_probe",
    "ps",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "smp: 4 CPUs online",
    "arish: AriCodeOS shell",
    "cpus: 4 online",
    "uptime: ",
    "hello_app: hello from an SDK app (arg 7)",
    "run: hello_app exited with 0",
    "hello_app: hello from an SDK app (arg 8)",
    "perms_check: enumeration skips gaps ok",
    "run: perms_check exited with 0",
    "PID  STATE       NAME",
    "AriCodeOS: shutting down",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "ARICODEOS_KERNEL_READY"]
