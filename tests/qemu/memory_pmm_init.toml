# The PMM is built from the UEFI map and reports free memory consistent with QEMU (-m 512M).
name = "memory.pmm_init"
description = "PMM initialised from the UEFI map with ~460 MiB free"
level = "smoke"
areas = ["memory"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = ["[INFO ] pmm: 4", "MiB free of", "MiB addressable, bitmap 1", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC"]
