# Stage 2 (ADR 0013): the shell reads from a USB HID keyboard. init launches the
# console bridge with the input services (two virtio and the USB one); the host types over QMP (they go
# to the USB keyboard, the most recent handler) "cpus" + Enter and "shutdown" +
# Enter once it sees the bridge serving, and the shell receives them through the kernel
# ring as if they came from COM1. With several CPUs the prompt and the bridge
# marker may interleave on serial, so only the output is required.
name = "shell.usb_keyboard"
description = "arish with a USB HID keyboard: the console bridge carries keystrokes to the kernel input ring"
level = "full"
areas = ["shell", "input", "usb", "console"]
cmdline = "qemu_exit shell"
usb_hid = true
timeout_secs = 60

[host_input]
marker = "CONSOLE_BRIDGE_READY"
keys = ["c", "p", "u", "s", "ret", "s", "h", "u", "t", "d", "o", "w", "n", "ret"]

[expect]
exit = 33
serial_contains = [
    "usb-input: device ready: USB HID Keyboard+Mouse",
    "AriInit: console bridge with 3 input device(s)",
    "arish: AriCodeOS shell",
    "cpus: ",
    "ari> shutdown",
    "[host] QMP: 28 input events sent",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "init no responde", "console-bridge: console rejects input"]
