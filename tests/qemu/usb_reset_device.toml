# Failure protocol (ADR 0028), incident 0001, audit 1 F10: a device that is
# still on its port is enumerated again on its own slot. `usb_fault=idle:reset`
# makes the driver treat the stick as not answering on the first block
# request after two idle seconds (as when it rejects the class reset): the
# request answers Io and the idle loop resets the port, sends Reset Device
# (xHCI 4.6.11) to the Configured slot, addresses it again (4.6.5) on the
# same Output Device Context, EP0 ring and Input Context, configures the
# bulk endpoints on their rings emptied in place and runs INQUIRY / TEST
# UNIT READY / READ CAPACITY. No slot is disabled and no DMA memory is
# allocated: the driver prints the arena usage after the re-enumeration
# against the one after the boot enumeration (Enable Slot is printed at
# boot, so its absence afterwards is proven by the arena line and the
# absent Disable Slot). The same medium comes back in service and the next
# write succeeds.
# `sleep 3000` provides the two idle seconds: the `repeat 10 ping` used
# before lasted that long only while every line of its output took a
# full repaint of the screen console (incident 0031).
name = "usb.reset_device"
description = "usbd: re-enumeration of a device still on its port uses Reset Device and reuses the slot and its memory"
level = "full"
areas = ["usb", "storage", "diag"]
usb_storage = true
cmdline = "qemu_exit shell usb_fault=idle:reset"
timeout_secs = 90
stdin = [
    "sleep 3000",
    "write probe.txt after idle",
    "repeat 3 ping 10.0.2.2",
    "write probe.txt second try",
    "diag",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "usb-input: injected fault: the device is re-enumerated in place after a port reset",
    "write: write error",
    "usb-input: re-enumerating the storage device on port ",
    "after a port reset (attempt 1)",
    "is Configured: Reset Device (xHCI 4.6.11), then Address Device",
    "usb-input: Reset Device slot ",
    "usb-input: storage device ",
    "usb-input: USB storage on port ",
    "usb-input: storage device back in service",
    "bytes used after the boot enumeration",
    "bytes used, 0 more than after the boot enumeration",
    "write: 11 bytes to probe.txt",
    "fault reported by process",
    "usb inj w lba",
    "usb reenum",
    "usb reenum ok",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = [
    "KERNEL PANIC",
    "strict",
    "Disable Slot",
    "no DMA",
    "slot memory abandoned",
    "reusing the DMA memory of a released slot",
    "given up until",
    "re-enumeration failed",
    "a different medium",
    "usb cmd fail",
    "usb cmd refused",
    "usb cmd pending",
]
