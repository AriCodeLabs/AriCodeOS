# Auditoria e9fdf38, hallazgo 4: si AriBoot no puede persistir el intento del
# slot pendiente (disco de solo lectura), no arranca ese slot, que podria
# repetirse sin fin, sino el activo.
name = "update.readonly_no_pending_boot"
description = "sin poder guardar el intento, AriBoot arranca el slot activo"
level = "full"
areas = ["update", "boot"]
cmdline = "qemu_exit test=random"
disk = "pending-b"
disk_readonly = true

[expect]
exit = 33
serial_contains = [
    "slots: estado activo A, pendiente B (3 intentos)",
    "slots: no se pudo escribir el estado de arranque",
    "slots: intento del pendiente no persistido: arranque del activo -> slot A",
    "slots: arrancando desde el slot A (imagen version 1)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B"]
