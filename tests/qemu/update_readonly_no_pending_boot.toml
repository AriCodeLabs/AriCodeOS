# Audit e9fdf38, finding 4: if AriBoot cannot persist the attempt for the
# pending slot (read-only disk), it does not boot that slot, which could
# repeat forever, but the active one instead.
name = "update.readonly_no_pending_boot"
description = "unable to save the attempt, AriBoot boots the active slot"
level = "full"
areas = ["update", "boot"]
cmdline = "qemu_exit test=random"
disk = "pending-b"
disk_readonly = true

[expect]
exit = 33
serial_contains = [
    "slots: state active A, pending B (3 tries)",
    "slots: could not write the boot state",
    "slots: pending try not persisted: booting active -> slot A",
    "slots: booting from slot A (image version 1)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "boot_slot=B"]
