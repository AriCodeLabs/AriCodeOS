# Fault injection: deliberate kernel panic. It must print the panic block
# (section 53) and terminate QEMU with a failure code.
name = "boot.kernel_panic_reports"
description = "test=panic -> readable KERNEL PANIC block and exit 35"
level = "full"
areas = ["boot", "panic"]
cmdline = "qemu_exit test=panic"

[expect]
exit = 35
serial_contains = ["ARICODEOS KERNEL PANIC", "Reason: test=panic: deliberate failure", "Where: kernel/src/main.rs"]
serial_absent = ["ARICODEOS_KERNEL_READY"]
