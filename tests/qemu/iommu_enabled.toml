# Fase 33: QEMU arranca con intel-iommu y los virtio con iommu_platform=on;
# el kernel activa la traduccion, asigna cada dispositivo al dominio de su
# driver y el arranque normal (bloques, ficheros, red, entrada) sigue igual.
name = "iommu.enabled"
description = "VT-d activo: dominios por driver, todos los servicios de arranque funcionan traducidos"
level = "smoke"
areas = ["iommu", "drivers", "init"]
cmdline = "qemu_exit"
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "acpi: DMAR 48 bits, 1 unidad(es)",
    "iommu: unidad 0 @ 0xfed90000 version 1.0",
    "traduccion activa",
    "iommu: 1 unidad(es) activas",
    "iommu: 00:02.0 asignado al dominio",
    "iommu: 00:03.0 asignado al dominio",
    "iommu: 00:04.0 asignado al dominio",
    "iommu: 00:05.0 asignado al dominio",
    "virtio-blk: dispositivo listo",
    "AriInit: servicio de red ok",
    "AriInit: servicio de entrada ok",
    "AriInit: servicios de arranque completados",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "iommu: fallo DMA", "NO activada"]
