# The stable floor (audit of ADR 0045, M1): this machine once ran stable
# 3 (the `[floor]` of updater/state says so) and now runs 1 from slot A.
# The source offers a validly signed stable 2: older than the newest
# release this machine ran, so `update` names it and `upgrade` refuses it
# as a downgrade, recorded; `upgrade --allow-downgrade` is the owner's way
# below the floor, and says so. A channel switch back to stable meets the
# same floor (host tests, `a_switch_back_never_goes_below_the_stable_floor`).
name = "update.stable_floor"
description = "a stable release below the newest one this machine ran is a downgrade: refused, --allow-downgrade only"
level = "full"
areas = ["update", "network", "shell"]
disk = "update-empty"
timeout_secs = 150

[host_update]
system = 2
stable_floor = 3

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update", "upgrade", "upgrade --allow-downgrade", "diag", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "updater: system: installed 1, source 1 offers 2: older than stable 3, the newest release this machine ran; upgrade refuses it without --allow-downgrade",
    "updater: system: refused: a downgrade: stable 2 is older than stable 3, the newest release this machine ran (--allow-downgrade to force)",
    "update: updater exited with 40",
    "updater: system: downgrading below the stable floor 3 to 2 (--allow-downgrade)",
    "updater: installed into slot B",
    "updater: system 2 installed: reboot to apply",
    ": upd-downgrade-refused (code 40)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "index refused", "upd-floor-damaged"]
