name = "memory.vmm_init"
description = "own page tables active, W^X, guarded stack and boot memory reclaimed"
level = "smoke"
areas = ["memory"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "vmm: own tables active",
    "W^X on the image",
    "boot memory returned to the PMM",
    "KiB kept for the kernel",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "EXCEPTION"]
