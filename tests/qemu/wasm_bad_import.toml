# Audit 6ee19fb, finding 5: a valid module imports aricode.file_write
# with a signature that differs from the host's. The runner compares it at link time
# and runs nothing (previously it accessed nonexistent arguments and died).
name = "wasm.bad_import"
description = "WASM module with an import of incompatible signature: rejected at link time, not run"
level = "full"
areas = ["wasm", "sandbox", "shell"]
cmdline = "qemu_exit shell"
disk = "wasm-bad-import"
timeout_secs = 90
stdin = ["run wasm_runner 5", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "wasm_runner: import aricode.file_write has an incompatible signature",
    "run: wasm_runner exited with 14",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "panic in user program", "module failed"]
