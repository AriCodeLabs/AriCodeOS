# Phase 21: `reboot` from the shell restarts the machine; with -no-reboot QEMU
# exits with code 0 instead of booting again.
name = "shell.reboot"
description = "arish: reboot restarts the machine (QEMU exits due to -no-reboot)"
level = "full"
areas = ["shell", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = ["exit-no", "reboot"]

[expect]
exit = 0
serial_contains = [
    "unknown command: exit-no (help)",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "ARICODEOS_SHUTDOWN"]
