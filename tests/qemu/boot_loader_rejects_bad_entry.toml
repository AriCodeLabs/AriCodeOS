# Fault injection: e_entry = 0 (audit 2026-09-26, finding 3). AriBoot must
# reject the ELF before ExitBootServices instead of jumping to an invalid
# address and triggering a firmware exception.
name = "boot.loader_rejects_bad_entry"
description = "e_entry=0 -> AriBoot rejects the ELF without jumping"
level = "full"
areas = ["boot"]
cmdline = "qemu_exit"

# No slots: these scenarios exercise the ESP path.
disk = "esp-only"

[inject]
patch_entry = 0

[expect]
exit = 35
serial_contains = ["entry point outside an executable segment"]
serial_absent = ["ExitBootServices -> AriKernel", "ARICODEOS_KERNEL_READY"]
