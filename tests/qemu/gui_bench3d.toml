# The graphics benchmark (ADR 0080) runs on the system: its window opens through the
# broker, and each of its sixteen scenes draws 3 frames and gives its line in the
# format of ADR 0080. QEMU's figures say nothing about speed: the reference laptop
# measures, with the same method as the Linux reference (5 s a scene, below 70 C to
# start, 90 C to stop).
name = "gui.bench3d"
description = "the graphics benchmark draws each of its scenes and logs them"
level = "release"
areas = ["gui", "apps"]
# Two processors: the frames are drawn in two bands, one on a pool thread
# (ADR 0082), and the pictures caught must still be whole.
cpus = 2
cmdline = "qemu_exit gui shell gui_trace"
install = ["desktop/bench3d"]
stdin = ["run bench3d 3", "sleep 500", "shutdown"]
timeout_secs = 120

[host_input]
marker = "bench3d.texture-linear us "
screendump = "scene"

[[host_input_then]]
marker = "bench3d.objects us "
screendump = "objects"

[[host_input_then]]
marker = "bench3d.shadow-fast us "
screendump = "shadow"

[[host_input_then]]
marker = "bench3d.fractal us "
screendump = "fractal"

[[host_input_then]]
marker = "bench3d.everything us "
screendump = "everything"

[expect]
exit = 33
serial_contains = [
    "compositor: window 1 'Bench3D' 800x600",
    "# machine=unknown build=",
    "renderer=cpu threads=2 textures=v2 present=double",
    "heap_free_bytes=",
    "bench3d.geometry us ",
    "bench3d.texture-mipmap us ",
    "bench3d.effect2d-5x5 us ",
    "bench3d.desktop us ",
    "bench3d.shadow-slow us ",
    "bench3d.shadow-fast us ",
    "bench3d.fractal us ",
    "bench3d.everything us ",
    "bench3d: 16 scenes measured",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "killed by fault", "bench3d: no memory", "bench3d: could not", "bench3d: started without"]
