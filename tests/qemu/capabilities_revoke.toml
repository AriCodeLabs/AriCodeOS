# Phase 13: derivation with fewer rights, per-object revocation (invalidates all
# of its handles, requires MANAGE) and isolation between objects. Success = 21.
name = "capabilities.revoke"
description = "Rust program in ring 3: derive, revoke (MANAGE), handle revoked in all its duplicates"
level = "full"
areas = ["capabilities", "user"]
cmdline = "qemu_exit test=user_caps"

[expect]
exit = 33
serial_contains = ["writing through the duplicate", "the console is still alive", "'caps' exited with code 21", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "USER FAULT"]
