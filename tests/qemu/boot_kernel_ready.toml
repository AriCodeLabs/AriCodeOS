# Nominal boot: the cornerstone of CI (section 109 of the master document).
name = "boot.kernel_ready"
description = "AriBoot loads the kernel, which reports hardware and emits READY"
level = "smoke"
areas = ["boot"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "AriBoot",
    "ExitBootServices -> AriKernel",
    "AriCodeOS booting...",
    "memory map:",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "[ERROR]"]
