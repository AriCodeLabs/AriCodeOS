# Stage 5 (measurements): `bench` measures syscalls, IPC to fsd and files with
# percentiles; `cpus` shows per-CPU idle time and `diag` gathers a report.
# Values are not compared here (they depend on the host and on TCG): what is required is that
# the measurements are produced and that the system is not saturated when idle.
name = "perf.bench"
description = "bench: syscall, IPC and file percentiles; per-CPU idle; diag report"
level = "full"
areas = ["perf", "shell", "sandbox"]
cmdline = "qemu_exit shell"
timeout_secs = 180
stdin = ["run bench", "cpus", "diag", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "bench: calibration ",
    "bench: syscall thread_get_tid (10000): p50 ",
    "bench: ipc fsd list (1000): p50 ",
    "bench: replace 4 KiB (100): p50 ",
    "bench: read 4 KiB (100): p50 ",
    "bench: done",
    "run: bench exited with 0",
    "% idle",
    "=== AriCodeOS diagnostics ===",
    "SERVICE          STATE        GEN  RESTARTS   LAST EXIT         READY FOR",
    "=== end of diagnostics ===",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "bench: no se pudo calibrar"]
