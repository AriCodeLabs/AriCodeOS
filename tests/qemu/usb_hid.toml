# Phase 25 (part two): xHCI with a USB HID keyboard and mouse. The kernel hands
# the controller to the usb_input driver; the host injects over QMP "hola" + Enter,
# a move and a click (they go to the USB keyboard and mouse, the most recent
# handlers) and input_client reads them over IPC.
name = "usb.hid"
description = "test=usb_hid: xHCI + USB HID keyboard and mouse (boot protocol) with events injected via QMP"
level = "full"
areas = ["usb", "input", "drivers"]
cmdline = "qemu_exit test=usb_hid"
usb_hid = true
timeout_secs = 40

[host_input]
marker = "INPUT_READY"
keys = ["h", "o", "l", "a", "ret"]
mouse_rel = [10, -5]
click = "left"

[expect]
exit = 33
serial_contains = [
    "usb-input: xHCI ready (",
    "HID keyboard (boot protocol, 8 bytes per report",
    "HID mouse (boot protocol,",
    "usb-input: device ready: USB HID Keyboard+Mouse",
    "input_client: device 0: USB HID Keyboard+Mouse",
    "input_client: keyboard: hola",
    "input_client: mouse: left button pressed",
    "input_client: mouse: dx=10 dy=-5",
    "input_client: input events over IPC ok",
    "usb hid selftest ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER FAULT", "nobody typed", "initialization failed"]
