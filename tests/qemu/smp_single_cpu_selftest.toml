# Phase 32: the same self-test with a single CPU degrades cleanly (no
# APs, no IPI): the SMP code does not depend on there being more than one processor.
name = "smp.single_cpu_selftest"
description = "test=smp with one CPU: without APs or IPI the self-test still passes"
level = "full"
areas = ["smp"]
cmdline = "qemu_exit test=smp"
cpus = 1

[expect]
exit = 33
serial_contains = [
    "smp: 1 CPU online (no APs in the MADT)",
    "smp selftest ok (1 CPUs:",
    "(0 IPI)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
