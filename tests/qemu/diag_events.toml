# Stage 5 (queryable diagnostics): the kernel keeps recent events
# (processes created and exited, faults) in a ring that `diag` shows
# with their timestamp; a process killed by the kernel appears with the reason.
name = "diag.events"
description = "diag shows recent kernel events: exited processes and killed ones with the reason"
level = "full"
areas = ["diag", "shell", "user"]
cmdline = "qemu_exit shell"
timeout_secs = 120
stdin = ["run hello_app 4", "run kernel_read", "diag", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "run: hello_app exited with 0",
    "run: kernel_read: was killed by the kernel",
    "recent kernel events:",
    "s] process 20 'hello_app' created",
    "s] process 20 'hello_app' exited with code 0",
    "s] process 21 killed by fault: #PF read",
    "=== end of diagnostics ===",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "diag: no access"]
