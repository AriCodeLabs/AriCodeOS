# Incident 0017: a driver must not release a client buffer the device may
# still own. `blk_fault=4300` makes virtio-blk leave the device unnotified
# of the first request on LBA 4300 (a lost doorbell): the request times out
# for real and its descriptor chain stays in the ring. `blk_late` then
# closes that buffer, pushes it out of the server's mapping cache,
# allocates fresh buffers (which get its frames if they were freed) and
# sends a valid request, which makes the device process whatever is still
# in its ring. No fresh buffer may receive disk data, and the valid request
# must succeed: the driver keeps the timed-out request's buffer, resets the
# device (which drops the stale chain) and only then releases it.
#
# Boot 1 has `iommu=off`, untranslated DMA as on the reference laptop:
# before the fix the device's late write landed in a fresh buffer on the
# timed-out buffer's frame. Boot 2 has the IOMMU on: before the fix the
# late write was an IOMMU fault.
name = "storage.late_completion"
description = "virtio-blk: a timed-out request's buffer is kept until the device is reset, so a late completion never lands in reused memory"
level = "full"
areas = ["storage", "virtio", "drivers"]
timeout_secs = 120

[[boots]]
cmdline = "qemu_exit iommu=off blk_fault=4300"
[boots.expect]
exit = 33
serial_contains = [
    "iommu: disabled on the command line (iommu=off); untranslated DMA",
    "virtio-blk: injected fault: the device is not notified of this request (blk_fault)",
    "virtio-blk: client buffer kept until the device is reset: its request did not complete",
    "virtio-blk: resetting the device: a request did not complete",
    "virtio-blk: client buffer released: the device was reset",
    "blk_late: the request timed out (Io), as injected",
    "blk_late: buffer A closed and pushed out of the server's mapping cache",
    "blk_late: no late write reached reused memory; the next request succeeded",
    "AriInit: late completion test ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = [
    "KERNEL PANIC",
    "late device write",
    "the ring still held the old chain",
    "device given up",
]

[[boots]]
cmdline = "qemu_exit blk_fault=4300"
[boots.expect]
exit = 33
serial_contains = [
    "virtio-blk: injected fault: the device is not notified of this request (blk_fault)",
    "virtio-blk: client buffer released: the device was reset",
    "blk_late: no late write reached reused memory; the next request succeeded",
    "AriInit: late completion test ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = [
    "KERNEL PANIC",
    "DMA fault",
    "late device write",
    "the ring still held the old chain",
    "device given up",
]
