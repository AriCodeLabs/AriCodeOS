# Network update (ADR 0027): the host publishes a version-2 image in
# build/update/ (served at http://10.0.2.2:17010/update/), the channel URL is
# in the updater's private directory and the UPDATE partition starts empty.
# `update` downloads the image into UPDATE, verifies it, installs it into
# slot B and schedules it; after `reboot`, AriBoot boots B and init confirms.
name = "update.network"
description = "update: download the signed image from the channel, install it into the inactive slot, boot it"
level = "full"
areas = ["update", "network", "shell", "boot"]
disk = "update-empty"
host_update = true
timeout_secs = 150

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update check", "update", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "AriInit: launch updater with manifest [system fs net block] memory 6144 KiB",
    "updater: installed version 1, channel offers version 2",
    "updater: downloading aricodeos-2.img (",
    "updater: download complete and SHA-256 verified",
    "updater: UPDATE image version 2 verified (",
    "updater: installed into slot B",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "updater: UPDATE does not contain"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update check", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: boot confirmed on slot B",
    "updater: installed version 2, channel offers version 2: up to date",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "rollback"]
