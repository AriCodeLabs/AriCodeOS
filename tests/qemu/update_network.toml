# Network update from a source (ADR 0027, ADR 0029): the host publishes a
# source in the scenario directory (signed index, version-2 system image) served
# by its own server at http://10.0.2.2:{update_port}/update/, registered in
# updater/sources and the UPDATE partition starts empty, so the installed
# image can only come from the network. `update` verifies the index and
# reports; `upgrade` downloads the image into memory, checks it against the
# index and its own signature, writes slot B and schedules it; after
# `reboot`, AriBoot boots B, init confirms it and `update` says up to date.
name = "update.network"
description = "update + upgrade: verified index, signed image into the inactive slot, reboot into it"
level = "full"
areas = ["update", "network", "shell", "boot"]
disk = "update-empty"
timeout_secs = 180

[host_update]
system = 2

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update", "upgrade", "reboot"]
[boots.expect]
exit = 0
serial_contains = [
    "AriInit: launch updater with manifest [system fs net block] memory 1024 KiB",
    "updater: source 1 http://10.0.2.2:{update_port}/update/: index verified (serial ",
    "updater: system: installed 1, source 1 offers 2: upgrade available",
    "updater: 1 upgrade(s) available: run upgrade",
    "updater: downloading aricodeos-2.img (",
    "updater: system image version 2 verified (signature and SHA-256)",
    "updater: installed into slot B",
    "updater: state: active A, pending B (3 tries); reboot to try it",
    "updater: system 2 installed: reboot to apply",
    "AriCodeOS: rebooting",
]
serial_absent = ["KERNEL PANIC", "update: updater exited with", "index refused", "update: installer exited"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["update", "cat updater/history.log", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "slots: booting from slot B (image version 2, pending confirmation)",
    "AriInit: boot confirmed on slot B",
    "updater: system: installed 2, source 1 offers 2: up to date",
    "updater: everything is up to date",
    "system 1 -> 2 installed into slot B from http://10.0.2.2:{update_port}/update/ (pending until reboot)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "rollback", "update: updater exited with", "index refused"]
