# Stage 3 (per-resource permissions, ADR 0016): the notes_reader manifest requests
# a specific file in read mode; the broker hands it an fsd endpoint
# bound to that file, fsd enforces the restriction (Denied on write, everything
# else invisible) and hello_app, with its private directory, gets a different
# object in the same session.
name = "sandbox.shared_file"
description = "read_files: one shared read-only file per app, enforced by fsd"
level = "full"
areas = ["sandbox", "filesystem", "shell", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 120
stdin = ["run notes_reader", "run hello_app 3", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "AriInit: launch notes_reader with manifest [system] memory 64 KiB read-only [hola.txt]",
    "fsd: shared file 'hola.txt' (read-only)",
    "notes_reader: hola.txt (17 bytes): Hola desde AriFS",
    "notes_reader: read-only enforced (Denied on create, write, replace and flush; README invisible)",
    "run: notes_reader exited with 0",
    "fsd: private directory 'hello_app'",
    "hello_app: private file 'notas' written and read",
    "run: hello_app exited with 0",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "pude escribir", "pude abrir", "I see more than one file", "denied"]
