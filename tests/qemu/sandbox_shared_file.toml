# Etapa 3 (permisos por recurso, ADR 0016): el manifiesto de notes_reader pide
# un fichero concreto en modo lectura; el broker le entrega un endpoint de fsd
# ligado a ese fichero, fsd aplica la restriccion (Denied al escribir, el
# resto invisible) y hello_app, con su directorio privado, recibe un objeto
# distinto en la misma sesion.
name = "sandbox.shared_file"
description = "read_files: un fichero compartido de solo lectura por app, aplicado por fsd"
level = "full"
areas = ["sandbox", "filesystem", "shell", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 120
stdin = ["run notes_reader", "run hello_app 3", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "AriInit: lanzar notes_reader con manifiesto [system] memoria 64 KiB solo lectura [hola.txt]",
    "fsd: fichero compartido 'hola.txt' (solo lectura)",
    "notes_reader: hola.txt (17 bytes): Hola desde AriFS",
    "notes_reader: solo lectura respetada (Denied en create, write, replace y flush; README invisible)",
    "run: notes_reader termino con 0",
    "fsd: directorio privado 'hello_app'",
    "hello_app: fichero privado 'notas' escrito y leido",
    "run: hello_app termino con 0",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "pude escribir", "pude abrir", "veo mas de un fichero", "denegado"]
