# Phase 34: Spanish keyboard (`kbd=es`) on the PS/2 console. The host types
# "hola", shift+period (`:` in the Spanish layout, `>` in the US one) and
# shift+7 (`/`) over QMP; the kernel receives "hola:/".
name = "console.ps2_es"
description = "PS/2 keyboard with Spanish layout: shift+period is ':' and shift+7 is '/'"
level = "full"
areas = ["console", "hardware"]
cmdline = "qemu_exit test=console_ps2 kbd=es"
timeout_secs = 40

[host_input]
marker = "CONSOLE_PS2_READY"
keys = ["h", "o", "l", "a", "shift+dot", "shift+7", "ret"]

[expect]
exit = 33
serial_contains = [
    "layout es)",
    "console: PS/2 line 'hola:/' (6 bytes, 18 scancodes)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "nobody typed"]
