# Incident 0017: a Disable Slot that does not release its slot (xHCI
# 4.6.4: after any code but Success or Slot Not Enabled the controller may
# still own the slot's rings and the TDs on them) leaves the request's
# client buffer in the controller's hands. `usb_fault=idle:unreleased`
# gives the endpoint up on the first block request after two idle seconds,
# as `reenum` does, and reads the Disable Slot completion as Context State
# Error. The driver must keep that buffer for good (it has no controller
# reset after boot), record it, and still re-enumerate the stick and serve
# the next write.
# `sleep 3000` provides the two idle seconds: the `repeat 10 ping` used
# before lasted that long only while every line of its output took a
# full repaint of the screen console (incident 0031).
name = "usb.unreleased_slot"
description = "usbd: a Disable Slot that does not release the slot keeps the request's client buffer for good"
level = "full"
areas = ["usb", "storage", "diag"]
usb_storage = true
cmdline = "qemu_exit shell usb_fault=idle:unreleased"
timeout_secs = 90
stdin = [
    "sleep 3000",
    "write probe.txt after idle",
    "repeat 3 ping 10.0.2.2",
    "write probe.txt second try",
    "diag",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "usb-input: injected fault: the endpoint is given up",
    "usb-input: injected fault: the Disable Slot completion is read as Context State Error",
    "usb-input: slot memory abandoned: Disable Slot did not release the slot",
    "usb-input: client buffer kept for good: its slot was not released",
    "write: write error",
    "usb-input: storage device back in service",
    "write: 11 bytes to probe.txt",
    "usb ep lost",
    "usb slot mem abandoned",
    "usb buf for good",
    "ARICODEOS_SHUTDOWN",
]
# The Disable Slot's verdict comes first, the buffer is kept for good, and
# only then is the request answered.
serial_order = [
    "usb-input: slot memory abandoned: Disable Slot did not release the slot",
    "usb-input: client buffer kept for good: its slot was not released",
    "write: write error",
]
# Messages of a release (the pre-fix one and the current one): none may
# appear for a slot that was not released.
serial_absent = [
    "KERNEL PANIC",
    "releasing the client buffer it could still write",
    "the client buffer kept for it is released",
]
