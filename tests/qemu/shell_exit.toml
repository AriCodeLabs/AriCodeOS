# Phase 21: `exit` returns control to init, which logs it and exits; the
# kernel continues its normal path to ARICODEOS_KERNEL_READY.
name = "shell.exit"
description = "arish: exit ends the shell and init supervises it"
level = "full"
areas = ["shell", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = ["exit"]

[expect]
exit = 33
serial_contains = [
    "AriInit: shell exited with 0",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC"]
