# Phase 34: console of a laptop without a serial port. The host types "hola" +
# Enter over QMP; with no inputd running QEMU delivers it to the i8042 PS/2 keyboard and
# the kernel receives it via IRQ1 into the console ring.
name = "console.ps2"
description = "PS/2 keyboard (i8042) as console input: one line via IRQ1"
level = "full"
areas = ["console", "hardware", "interrupts"]
cmdline = "qemu_exit test=console_ps2"
timeout_secs = 40

[host_input]
marker = "CONSOLE_PS2_READY"
keys = ["h", "o", "l", "a", "ret"]

[expect]
exit = 33
serial_contains = [
    "console: PS/2 keyboard (GSI 1, vector 0x41, layout us)",
    "console: PS/2 line 'hola' (4 bytes, 10 scancodes)",
    "[host] QMP: 10 input events sent",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "nobody typed"]
