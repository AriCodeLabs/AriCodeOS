# The desktop's file manager (ADR 0074 phase C) on the owner's folder
# home/. From the keyboard: the launcher opens it; Tab, `mo` and Enter
# create home/mo; `p` and Ctrl+R rename it to p; Shift+Tab and Delete ask, and
# the answer deletes it. Each step answers in the window and on serial, and the shell
# finds home/ empty again.
name = "usb.desktop_files"
description = "the desktop file manager creates, renames and deletes files in home/"
level = "release"
areas = ["usb", "apps", "gui", "fs"]
cmdline = "qemu_exit shell"
selftest = false
disk = "usb-image"
install = ["desktop/launcher", "desktop/files"]
stick_profiles = ["desktop:launcher,files"]
stdin = ["sleep 17000", "ls", "shutdown"]
timeout_secs = 120

[host_input]
marker = "launcher: ready"
keys = ["ret"]

[[host_input_then]]
marker = "files: ready"
keys = ["tab", "m", "o", "ret", "p", "ctrl+r"]
key_delay_ms = 100

# Holding Delete asks once and answers nothing, or the key would empty the folder
# (audit of ADR 0078, stage 2, H2). Esc keeps the file. Asked again, the keys start on
# Keep: Tab and Enter delete it.
[[host_input_then]]
marker = "files: renamed mo to p"
keys = ["shift+tab"]
hold_key = ["delete", 900]

[[host_input_then]]
marker = "files: asks to delete p"
wait_ms = 300
screendump = "dialog"
keys = ["esc"]

[[host_input_then]]
marker = "files: kept the file"
keys = ["delete"]

[[host_input_then]]
marker = "files: asks to delete p"
keys = ["tab", "ret"]
key_delay_ms = 100

[expect]
exit = 33
serial_contains = [
    "launcher: offers files",
    "with manifest [window home]",
    "files: 0 file(s) in home/",
    "files: created mo",
    "files: renamed mo to p",
    "files: asks to delete p",
    "files: kept the file",
    "files: deleted p",
    "ARICODEOS_SHUTDOWN",
]
serial_order = ["files: created mo", "files: renamed mo to p", "files: deleted p", "ari> ls"]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "files: cannot", "home/p", "home/mo"]
