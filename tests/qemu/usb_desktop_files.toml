# The desktop's file manager (ADR 0074 phase C) on the owner's folder
# home/. From the keyboard: the launcher opens it; Tab, `mo` and Enter
# create home/mo; `p` and Ctrl+R rename it to p; Tab and Delete twice
# delete it. Each step answers in the window and on serial, and the shell
# finds home/ empty again.
name = "usb.desktop_files"
description = "the desktop file manager creates, renames and deletes files in home/"
level = "release"
areas = ["usb", "apps", "gui", "fs"]
cmdline = "qemu_exit shell"
selftest = false
disk = "usb-image"
install = ["desktop/launcher", "desktop/files"]
stick_profiles = ["desktop:launcher,files"]
stdin = ["sleep 15000", "ls", "shutdown"]
timeout_secs = 120

[host_input]
marker = "launcher: ready"
keys = ["ret"]

[[host_input_then]]
marker = "files: ready"
keys = ["tab", "m", "o", "ret", "p", "ctrl+r"]
key_delay_ms = 100

[[host_input_then]]
marker = "files: renamed mo to p"
keys = ["shift+tab", "delete", "delete"]
key_delay_ms = 100

[expect]
exit = 33
serial_contains = [
    "launcher: offers files",
    "with manifest [window home]",
    "files: 0 file(s) in home/",
    "files: created mo",
    "files: renamed mo to p",
    "files: press Delete again to delete p",
    "files: deleted p",
    "ARICODEOS_SHUTDOWN",
]
serial_order = ["files: created mo", "files: renamed mo to p", "files: deleted p", "ari> ls"]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "files: cannot", "home/p", "home/mo"]
