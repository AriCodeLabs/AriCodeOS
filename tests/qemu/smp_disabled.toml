# Phase 34: `smp=off` leaves the APs halted even if the machine has several CPUs
# (a switch for debugging real hardware).
name = "smp.disabled"
description = "smp=off with -smp 4: BSP only, normal boot"
level = "full"
areas = ["smp", "hardware"]
cmdline = "qemu_exit smp=off"
cpus = 4
timeout_secs = 60

[expect]
exit = 33
serial_contains = [
    "acpi: MADT lapic @ 0xfee00000, 4 cpu(s)",
    "smp: disabled on the command line (smp=off); 1 CPU",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "smp: 4 CPUs online"]
