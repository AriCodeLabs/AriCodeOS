name = "timer.init"
description = "PIC enmascarado, LAPIC habilitado, timer calibrado a 100 Hz, interrupciones activas"
level = "smoke"
areas = ["timer", "interrupts"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = ["[INFO ] apic: lapic id 0 version", "tick 100 Hz", "[INFO ] interrupciones habilitadas", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "interrupcion inesperada"]
