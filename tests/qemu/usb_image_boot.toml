# Phase 34: the USB stick image (GPT with its own FAT32 ESP + AriCodeOS
# partitions) boots on its own: OVMF loads AriBoot from the disk ESP, AriBoot
# boots slot A and the whole system comes up without the QEMU FAT disk.
name = "usb.image_boot"
description = "full boot from the USB image (FAT32 ESP on the GPT disk itself, slot A)"
level = "smoke"
areas = ["usb", "hardware", "boot", "update"]
cmdline = "qemu_exit"
disk = "usb-image"
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "cmdline: qemu_exit boot_slot=A",
    "virtio-blk: GPT with 6 partition(s)",
    "ESP LBA 2048..133119",
    "SYSA LBA 139264..163839",
    "fsd: AriFS mounted, 4 files",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "booting from the ESP"]
