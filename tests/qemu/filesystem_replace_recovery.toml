# Stage 2 (ADR 0014): the test disk carries a replacement of `README`
# committed to the AriFS journal but not applied (what is left after a
# power cut right after the commit). fsd replays it at mount and the shell reads
# the whole new content.
name = "filesystem.replace_recovery"
description = "AriFS replays at mount an atomic replace that was committed and cut off before being applied"
level = "full"
areas = ["filesystem", "storage", "shell"]
cmdline = "qemu_exit shell"
disk = "fs-pending-replace"
timeout_secs = 60
stdin = ["cat README", "shutdown"]

[expect]
exit = 33
serial_contains = [
    "fsd: pending replace of 'README' redone at mount",
    "fsd: AriFS mounted, 4 files",
    "AriCodeOS: recuperado tras un corte",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "no contiene AriFS", "AriFS corrupto", "disco de pruebas con AriFS"]
