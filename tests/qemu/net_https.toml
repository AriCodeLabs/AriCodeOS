# HTTPS (rustls client on aricode-crypto, ADR 0067): the runner starts
# three `openssl s_server -www` on the host: one with a certificate for
# 10.0.2.2 (an iPAddress name) from a test CA installed in AriFS as
# trusted_ca.der, one self-signed, and the first again with TLS 1.2 only.
# The shell's `http` fetches over TLS 1.3 from the first, refuses the
# second, and fetches over TLS 1.2 from the third. The kernel's real-time
# clock provides the date for the validity check.
name = "net.https"
description = "http https://...: TLS 1.3 and TLS 1.2 handshakes, certificate chain to a trusted root, refusal of an unknown issuer"
level = "full"
areas = ["network", "shell", "tls"]
cmdline = "qemu_exit shell"
host_https = true
timeout_secs = 120
stdin = [
    "http https://10.0.2.2:{https_port}/",
    "http https://10.0.2.2:{https_untrusted_port}/",
    "http https://10.0.2.2:{https_tls12_port}/",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "rtc: 20",
    "sshd: no authorized_keys in AriFS: not listening",
    "HTTP 200,",
    "s_server -www",
    "http: TLS: certificate signed by an unknown authority",
    "Protocol  : TLSv1.2",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "http: invalid response", "sshd: listening"]
