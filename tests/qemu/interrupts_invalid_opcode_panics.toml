name = "interrupts.invalid_opcode_panics"
description = "test=invalid_opcode -> #UD with dump and panic"
level = "full"
areas = ["interrupts"]
cmdline = "qemu_exit test=invalid_opcode"

[expect]
exit = 35
serial_contains = ["EXCEPTION #UD (6) Invalid Opcode", "RIP: 0xffffffff8", "ARICODEOS KERNEL PANIC", "Reason: exception #UD (6)"]
serial_absent = ["ARICODEOS_KERNEL_READY"]
