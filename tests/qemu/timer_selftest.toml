name = "timer.selftest"
description = "test=timer: ~5 ticks in 50 ms of PIT, sleep_ms wakes up, no spurious interrupts"
level = "full"
areas = ["timer"]
cmdline = "qemu_exit test=timer"

[expect]
exit = 33
serial_contains = ["timer selftest ok (", "ticks in 50 ms of PIT", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC"]
