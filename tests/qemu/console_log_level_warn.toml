# log=warn silences INFO and DEBUG; unformatted markers are still printed.
name = "console.log_level_warn"
description = "log=warn hides INFO and DEBUG"
level = "full"
areas = ["console"]
cmdline = "qemu_exit log=warn"

[expect]
exit = 33
serial_contains = ["AriCodeOS booting...", "ARICODEOS_KERNEL_READY"]
serial_absent = ["[INFO ]", "[DEBUG]", "KERNEL PANIC"]
