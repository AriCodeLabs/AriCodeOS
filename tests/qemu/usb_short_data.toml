# Incident 0010 (ADR 0028): a command that passed but did not move every
# byte of its data stage (BOT 6.7.2, 6.7.3: the host's transfer fell short
# or dCSWDataResidue is not zero) is never a success: a READ would hand
# the client stale bytes, a WRITE did not reach the medium whole.
# `usb_fault=idle:short-data` makes the data stage of the first block
# request after two idle seconds look one sector (512 bytes) short at the
# transport boundary. Before the fix the driver discarded both counts and
# acknowledged the write. The driver must answer Io with the count, record
# the fault, leave the transport Ready (no Reset Recovery: the CSW was
# valid) and serve the next write.
name = "usb.short_data"
description = "usbd: a data stage one sector short is never a success; the request answers Io with the count, fault in diag, no recovery, the next write succeeds"
level = "full"
areas = ["usb", "storage", "diag"]
usb_storage = true
cmdline = "qemu_exit shell usb_fault=idle:short-data"
timeout_secs = 90
stdin = [
    "repeat 10 ping 10.0.2.2",
    "write probe.txt after idle",
    "repeat 3 ping 10.0.2.2",
    "write probe.txt second try",
    "diag",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "usb-input: injected fault: the data stage is reported one sector (512 bytes) short",
    "usb-input: WRITE(10) lba ",
    ": 512 bytes not transferred",
    "write: write error",
    "write: 11 bytes to probe.txt",
    "fault reported by process",
    "usb short data (code 512)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = [
    "KERNEL PANIC",
    "strict",
    "reset recovery",
    "Stall Error",
    "stray transfer event",
    "no completion event",
    "re-enumerating",
    "transfer recovered",
]
