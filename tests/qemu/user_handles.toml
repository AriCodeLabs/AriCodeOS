# Phase 12: a process cannot use forged or closed handles, handles without rights,
# or escalate rights when duplicating. Success = code 11; any other code
# is the step that failed.
name = "user.handles"
description = "handles: object_kind, forged, duplicated without rights, escalation, closed, wrong object"
level = "full"
areas = ["user", "capabilities"]
cmdline = "qemu_exit test=user_handles"

[expect]
exit = 33
serial_contains = ["'handles' exited with code 11", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "USER FAULT", "ok\n"]
