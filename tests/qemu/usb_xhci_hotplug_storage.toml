# Plug and play next to the USB stick usbd boots from (the real laptops
# boot that way): the test disk is `usb-storage` on the same xHCI
# (`usb_storage`, `usb_xhci`: eight USB 2 ports). Block I/O runs (a long
# `repeat` of writes) while HID devices come and go, and must not notice:
#  1. Once the writes run, a mouse is plugged in, enumerated and moved.
#  2. A keyboard and a second mouse fill the driver's four device entries
#     with the stick (MAX_DEVICES counts it); a third mouse is refused.
#  3. The second mouse is unplugged, and a second USB stick (a blank 1 MiB
#     drive, `usb_spare_disk`) plugged in: refused, the stick stays the
#     only one. (QEMU's `usb-bot` without a LUN does not attach at all.)
#  4. The hot-plugged keyboard types `write after.txt x`, `cat probe.txt`
#     and `shutdown`: the stick still takes a write after the refusals,
#     reads back what was written and flushes on shutdown.
# Each stage waits for the line the previous one causes (incident 0059);
# the order check also needs writes of the `repeat` after the keyboard was
# enumerated (I/O while devices come and go).
name = "usb.xhci_hotplug_storage"
description = "usbd: HID devices plugged in and out next to the boot USB stick while it serves writes; a second stick is refused"
level = "release"
areas = ["usb", "drivers", "input", "storage"]
cmdline = "qemu_exit shell"
usb_storage = true
usb_xhci = true
usb_spare_disk = true
no_virtio_input = true
timeout_secs = 120
stdin = ["repeat 600 write probe.txt block io during hot-plug"]

[[host_hotplug]]
marker = "bytes to probe.txt"
driver = "usb-mouse"
bus = "xhci.0"
port = "2"
id = "m1"

[[host_hotplug]]
marker = "usb-input: first report from slot"
driver = "usb-kbd"
bus = "xhci.0"
port = "3"
id = "k1"

[[host_hotplug]]
marker = "HID keyboard (boot protocol"
delay_ms = 300
driver = "usb-mouse"
bus = "xhci.0"
port = "4"
id = "m2"

[[host_hotplug]]
marker = "new bytes of the DMA arena"
driver = "usb-mouse"
bus = "xhci.0"
port = "5"
id = "m3"

[[host_hotplug]]
marker = "device entries are in use"
action = "remove"
id = "m2"

[[host_hotplug]]
marker = "usb-input: port 8: device on slot 4 detached"
driver = "usb-storage"
bus = "xhci.0"
port = "6"
drive = "spare"
id = "s2"

[host_input]
marker = "HID mouse (boot protocol"
wait_ms = 500
mouse_rel = [10, -5]

[[host_input_then]]
marker = "a storage device is already present; ignoring"
wait_ms = 300
key_delay_ms = 30
echo_prompt = "ari> "
keys = [
    "w", "r", "i", "t", "e", "spc", "a", "f", "t", "e", "r", "dot", "t", "x", "t", "spc", "x", "ret",
    "c", "a", "t", "spc", "p", "r", "o", "b", "e", "dot", "t", "x", "t", "ret",
    "s", "h", "u", "t", "d", "o", "w", "n", "ret",
]

[expect]
exit = 33
serial_contains = [
    "usb-input: USB storage on port 1",
    "usb-input: port 6: HID mouse (boot protocol, 4 bytes per report, endpoint 1)",
    "usb-input: port 7: HID keyboard (boot protocol, 8 bytes per report, endpoint 1)",
    "usb-input: port 8: device attached on slot 4, ",
    "usb-input: port 9: device not enumerated: all 4 device entries are in use (MAX_DEVICES)",
    "usb-input: port 8: device on slot 4 detached",
    "enumeration failed: a storage device is already present; ignoring; the port is left alone until it sees a new connection",
    "[host] hotplug: usb-storage added on xhci.0 port 6 as s2",
    "[host] QMP: 2 input events sent",
    "write: 2 bytes to after.txt",
    "ARICODEOS_SHUTDOWN",
]
serial_order = [
    "bytes to probe.txt",
    "usb-input: port 6: HID mouse (boot protocol",
    "usb-input: port 7: HID keyboard (boot protocol",
    "bytes to probe.txt",
    "usb-input: port 9: device not enumerated",
    "a storage device is already present; ignoring",
    "write: 2 bytes to after.txt",
    "cat probe.txt",
    "block io during hot-plug",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = [
    "KERNEL PANIC",
    "'usb_input' killed",
    "write: error",
    "write error",
    "usb dev lost",
    "re-enumerating the storage",
    "the storage device disconnected",
    "endpoint not recoverable",
    "reset recovery",
    "slot memory abandoned",
    "stray transfer event",
    "usb hid err",
    "usb cmd fail",
    "usb cmd pending",
    "usb cmd refused",
    "usb attach fail",
    "tried again with a port reset",
    "changed during its enumeration",
    "the connection changed",
    "[host] QMP: failed",
]
