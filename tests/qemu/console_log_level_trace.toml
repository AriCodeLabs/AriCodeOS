# log=trace muestra todos los niveles, incluido el desglose del mapa de memoria.
name = "console.log_level_trace"
description = "log=trace: aparecen TRACE y DEBUG"
level = "full"
areas = ["console"]
cmdline = "qemu_exit log=trace"

[expect]
exit = 33
serial_contains = ["[TRACE] logger activo en nivel TRACE", "[DEBUG]   free", "[DEBUG] stack:", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC"]
