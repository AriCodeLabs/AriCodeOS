# Audit review 2026-09-26, finding 1: an empty, unaligned RW PT_LOAD
# on the entry point page must not change the permissions of .text.
# It is ignored at load time and the system boots exactly the same.
name = "boot.loader_ignores_empty_segment"
description = "empty PT_LOAD at e_entry -> ignored, the kernel boots"
level = "full"
areas = ["boot"]
cmdline = "qemu_exit"

# No slots: these scenarios exercise the ESP path.
disk = "esp-only"

[inject]
add_empty_segment_at_entry = true

[expect]
exit = 33
serial_contains = ["ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "[ERROR]"]
