# A minimized window comes back with the pointer alone (ADR 0078): its minimize circle
# is at (68, 48) and the pointer starts at the centre of the 1280x800 screen. The window
# leaves a place with its title at the bottom, centred, and a click there brings it back.
name = "gui.window_shelf"
description = "a minimized window has a place at the bottom of the screen that brings it back"
level = "full"
areas = ["gui"]
cmdline = "qemu_exit gui shell"
install = ["examples/gui_demo"]
stdin = ["run gui_demo 3", "sleep 1000", "shutdown"]
timeout_secs = 60

[host_input]
marker = "gui_demo D: window presented"
mouse_rel = [-572, -352]
click = "left"

[[host_input_then]]
marker = "gui_demo D: focus lost"
wait_ms = 200
screendump = "shelf"
mouse_rel = [572, 726]
click = "left"

[[host_input_then]]
marker = "gui_demo D: focus gained"
keys = ["q"]

[expect]
exit = 33
serial_contains = ["gui_demo D: focus lost", "gui_demo D: done", "ARICODEOS_SHUTDOWN"]
serial_order = ["gui_demo D: focus lost", "gui_demo D: focus gained", "gui_demo D: done"]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW"]
