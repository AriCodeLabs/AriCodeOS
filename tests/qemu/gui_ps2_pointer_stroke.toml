# The stroke of gui.pointer_stroke on the PS/2 mouse (incident 0058): 150
# moves, one every 10 ms, through the i8042, the kernel's pump and
# ps2_input, with an empty EHCI idle beside it. Every event is handled
# within LATE_MS of its arrival and none is lost: the click lands at the
# same point of B as in gui.ps2_two_windows.
name = "gui.ps2_pointer_stroke"
description = "a touchpad-rate stroke on the PS/2 mouse is followed without lag or loss"
level = "full"
areas = ["gui", "input", "pointer"]
cmdline = "qemu_exit gui shell"
no_virtio_input = true
usb_legacy_controller = true
install = ["examples/gui_demo"]
stdin = ["spawn gui_demo 0", "run gui_demo 1", "sleep 5000", "shutdown"]
timeout_secs = 120

[host_input]
marker = "compositor: desktop ready with 2 windows"
mouse_rel = [-330, -20]
mouse_steps = [150, 1, 0, 10]
click = "left"
keys = ["h"]

[expect]
exit = 33
serial_contains = [
    "ps2-input: keyboard and pointer (wheel); serving requests",
    "compositor: desktop ready with 2 windows",
    "gui_demo B: click button 1 at (380,272)",
    "gui_demo B: key 'h'",
    "[host] QMP: 306 input events sent",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = [
    "KERNEL PANIC",
    "gui input late",
    "input event queue full",
    "PS/2 byte(s) dropped",
]
