# Sin log= en la cmdline el nivel es info: nada de DEBUG/TRACE en la serie.
name = "console.log_level_default_info"
description = "nivel por defecto info: sin lineas DEBUG ni TRACE"
level = "full"
areas = ["console"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = ["[INFO ] kernel:", "[INFO ] memory map:", "ARICODEOS_KERNEL_READY"]
serial_absent = ["[DEBUG]", "[TRACE]", "KERNEL PANIC"]
