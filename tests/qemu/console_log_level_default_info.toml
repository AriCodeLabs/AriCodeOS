# Without log= on the cmdline the level is info: no DEBUG/TRACE on serial.
name = "console.log_level_default_info"
description = "default level info: no DEBUG or TRACE lines"
level = "full"
areas = ["console"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = ["[INFO ] kernel:", "[INFO ] memory map:", "ARICODEOS_KERNEL_READY"]
serial_absent = ["[DEBUG]", "[TRACE]", "KERNEL PANIC"]
