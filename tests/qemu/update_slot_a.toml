# Phase 30: with the default disk AriBoot finds ARIBOOT (A active, nothing
# pending), verifies the signature and hashes of the slot A image and boots
# from it; init sees the slot in its arg.
name = "update.slot_a"
description = "nominal A/B boot: signed slot A image verified by AriBoot"
level = "smoke"
areas = ["update", "boot"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "slots: state active A, no pending",
    "slots: booting from slot A (image version 1)",
    "cmdline: qemu_exit selftest boot_slot=A",
    "AriInit: booted from slot A (active)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "booting from the ESP"]
