# Fase 30: con el disco por defecto AriBoot encuentra ARIBOOT (A activo, sin
# pendiente), verifica la firma y los hashes de la imagen del slot A y arranca
# desde ella; init ve el slot en su arg.
name = "update.slot_a"
description = "arranque A/B nominal: imagen firmada del slot A verificada por AriBoot"
level = "smoke"
areas = ["update", "boot"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "slots: estado activo A, sin pendiente",
    "slots: arrancando desde el slot A (imagen version 1)",
    "cmdline: qemu_exit boot_slot=A",
    "AriInit: arrancado desde el slot A (activo)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "arranque desde la ESP"]
