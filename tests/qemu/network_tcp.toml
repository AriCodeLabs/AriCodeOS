# Phase 23: TCP in netd. Echo against the host server, two connections at the
# same time, closed port (RST) and a server in the guest that the host
# connects to through hostfwd when it sees TCP_LISTEN_READY.
name = "network.tcp"
description = "TCP over IPC: connect, echo, multiple connections, RST, listen and accept"
level = "full"
areas = ["network", "init"]
cmdline = "qemu_exit"
timeout_secs = 90

[host_tcp]
marker = "TCP_LISTEN_READY"
payload = "hola desde el host"

[expect]
exit = 33
serial_contains = [
    "tcp_client: TCP echo ok",
    "tcp_client: two simultaneous connections ok",
    "tcp_client: refused connection detected",
    "tcp_client: incoming connection from 10.0.2.2 port ",
    "tcp_client: echoed to the host 18 bytes",
    "[host] TCP probe: echo of 18 bytes received",
    "tcp_client: TCP over IPC ok",
    "AriInit: TCP service ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "nobody connected"]
