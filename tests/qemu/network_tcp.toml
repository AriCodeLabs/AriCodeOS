# Fase 23: TCP en netd. Eco contra el servidor del host, dos conexiones a la
# vez, puerto cerrado (RST) y un servidor en el invitado al que el host se
# conecta por hostfwd cuando ve TCP_LISTEN_READY.
name = "network.tcp"
description = "TCP por IPC: conexion, eco, varias conexiones, RST, escucha y aceptacion"
level = "full"
areas = ["network", "init"]
cmdline = "qemu_exit"
timeout_secs = 90

[host_tcp]
marker = "TCP_LISTEN_READY"
payload = "hola desde el host"

[expect]
exit = 33
serial_contains = [
    "tcp_client: eco TCP ok",
    "tcp_client: dos conexiones simultaneas ok",
    "tcp_client: conexion rechazada detectada",
    "tcp_client: conexion entrante de 10.0.2.2 puerto ",
    "tcp_client: eco al host de 18 bytes",
    "[host] sonda TCP: eco de 18 bytes recibido",
    "tcp_client: TCP por IPC ok",
    "AriInit: servicio TCP ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "nadie se conecto"]
