# Phase 20: fsd mounts AriFS v0 from the ARI0 partition through the block
# service and a client lists, reads, creates, writes and re-reads files over IPC.
name = "filesystem.read_write"
description = "AriFS over IPC: list, open, read, create, write, errors"
level = "full"
areas = ["filesystem", "storage", "init"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "fsd: AriFS mounted, 4 files",
    "fsd: serving requests",
    "fs_client: hola.txt (17 bytes)",
    "fs_client: hola.txt says: Hola desde AriFS",
    "fs_client: atomic replace and flush ok",
    "fs_client: list, read, create and write over IPC ok",
    "virtio-blk: flush negotiated (VIRTIO_BLK_F_FLUSH)",
    "AriInit: file service ok",
    "AriInit: block service ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "no contiene AriFS", "USER STACK OVERFLOW"]
