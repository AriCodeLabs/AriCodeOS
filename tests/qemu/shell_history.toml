# Phase 34: shell history with the arrow keys. The runner types the sequence
# `ESC [ A` (up arrow, the same one a PS/2 or USB keyboard sends through the
# console), erases the end of the recalled line and types another name: the
# resulting command can only come from history. `ESC [ B` goes back to the
# empty line.
name = "shell.history"
description = "arish: up arrow recalls the last command and it can be edited; down arrow discards it"
level = "full"
areas = ["shell", "console"]
cmdline = "qemu_exit shell"
timeout_secs = 60
stdin = [
    "write uno.txt abc",
    "\u001b[A\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008\u0008dos.txt xyz",
    "cat dos.txt",
    "\u001b[A\u001b[A\u001b[B\u001b[B",
    "\u001b[3~ls",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "write: 4 bytes to uno.txt",
    "write: 4 bytes to dos.txt",
    "xyz",
    "dos.txt             4 bytes",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "comando unknown", "write: error"]
