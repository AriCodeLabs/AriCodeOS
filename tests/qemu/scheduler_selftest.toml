name = "scheduler.selftest"
description = "test=sched: fairness between threads that never yield, 50 ms sleep, block and wake"
level = "full"
areas = ["scheduler"]
cmdline = "qemu_exit test=sched"
timeout_secs = 40

[expect]
exit = 33
serial_contains = ["sched selftest ok (busy [", "preemptions, sleep 50 ms ->", "wait_one/wake_all)", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC"]
