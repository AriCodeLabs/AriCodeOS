# Phase 16: a user-space driver services PIT IRQ0 through an IRQ capability,
# allocates and maps a DMA buffer, and another one paints the framebuffer through an
# MMIO capability. The kernel checks the painted pixel.
name = "drivers.user_irq_mmio_dma"
description = "test=drivers: IRQ, DMA and MMIO from ring 3 with capabilities"
level = "full"
areas = ["drivers", "user"]
cmdline = "qemu_exit test=drivers"
timeout_secs = 40

[expect]
exit = 33
serial_contains = ["drivers selftest ok (IRQ0 serviced in ring 3", "framebuffer painted from ring 3)", "pit_driver: wait on the IRQ line and an endpoint ok", "ARICODEOS_KERNEL_READY"]
serial_absent = ["KERNEL PANIC", "USER FAULT", "has no registered line"]
