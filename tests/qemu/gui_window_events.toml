# The window protocol's events (ADR 0078, stage 0). Demo D (gui_demo 3) asks
# for them and says each kind the first time it comes. Its content is at
# (40,60), 400x300; the pointer starts at the centre of the 1280x800 screen.
# A window that does not ask gets none of this: gui.close_box and the others
# keep running with programs that do not know these events.
name = "gui.window_events"
description = "a window that asks gets motion, release, enter, leave, wheel, key codes, key repeat, damage and resize"
level = "full"
areas = ["gui"]
cmdline = "qemu_exit gui shell gui_trace"
install = ["examples/gui_demo"]
stdin = ["run gui_demo 3", "sleep 1000", "shutdown"]
timeout_secs = 120

[host_input]
marker = "gui_demo D: window presented"
mouse_rel = [-300, -200]

# The drag leaves the window: the button holds the pointer's events for it.
[[host_input_then]]
marker = "gui_demo D: motion"
drag = [-400, 30]

[[host_input_then]]
marker = "gui_demo D: release of the left button"
mouse_rel = [200, 0]
click = "wheel-up"

[[host_input_then]]
marker = "gui_demo D: wheel"
hold_key = ["a", 900]

[[host_input_then]]
marker = "gui_demo D: key code released"
keys = ["shift+b"]

[[host_input_then]]
marker = "gui_demo D: key code with shift"
keys = ["d"]

[[host_input_then]]
marker = "gui_demo D: presented a part"
keys = ["r"]

# Over the desktop, past the frame: leaving the content for the second time.
[[host_input_then]]
marker = "gui_demo D: resized to 500x350"
mouse_rel = [-190, -220]

[[host_input_then]]
marker = "gui_demo D: leave 2"
keys = ["q"]

[expect]
exit = 33
serial_contains = [
    "compositor: window 1 'Demo D' 400x300",
    "gui_demo D: enter",
    "gui_demo D: motion outside it, left held",
    "gui_demo D: leave 1",
    "gui_demo D: key code pressed",
    "gui_demo D: key code repeated",
    "gui_demo D: the key repeated",
    # The 20x20 part, alone.
    "flushed 400 px in 1 rect(s)",
    # The resized content's colour reached the screen.
    "= 0x208080",
    "gui_demo D: done",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "the resize failed", "the key did not repeat"]
serial_order = [
    "gui_demo D: motion outside it, left held",
    "gui_demo D: release of the left button",
    "gui_demo D: key code pressed",
    "gui_demo D: key code repeated",
    "gui_demo D: key code released",
    "gui_demo D: resized to 500x350",
    "gui_demo D: leave 2",
    "gui_demo D: done",
]
