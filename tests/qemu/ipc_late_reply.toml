# Etapa 1B (semantica IPC de plazos): una respuesta que llega despues del
# plazo del cliente se descarta y nunca se confunde con la de la peticion
# siguiente (endpoint de respuesta nuevo por peticion en el SDK).
name = "ipc.late_reply"
description = "test=ipc_late: plazo vencido, respuesta tardia descartada y peticiones correlacionadas"
level = "full"
areas = ["ipc", "user"]
cmdline = "qemu_exit test=ipc_late"
timeout_secs = 40

[expect]
exit = 33
serial_contains = [
    "late_client: plazo vencido, respuesta tardia descartada, respuestas correlacionadas ok",
    "ipc late reply selftest ok",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER FAULT", "respuesta confundida"]
