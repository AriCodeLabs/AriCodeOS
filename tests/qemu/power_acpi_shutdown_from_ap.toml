# Incident 0065: Linux (`migrate_to_reboot_cpu`) and FreeBSD (`kern_reboot`,
# bound to `CPU_FIRST()`) power off from the boot CPU, since some firmware
# does not when the S5 write comes from another processor. `poweroff_from=3`
# first moves the shell's `shutdown` call to CPU 3; the kernel must then move
# it to CPU 0 before interrupts go off and the other CPUs halt, and the
# machine powers off through ACPI S5 (QEMU exits with 0 on its own). A
# `poweroff.wait_ms` below its floor is refused and logged, not taken.
name = "power.acpi_shutdown_from_ap"
description = "a shutdown called on another CPU moves to the boot CPU and powers off through ACPI S5"
level = "full"
areas = ["hardware", "shell"]
cmdline = "shell poweroff_from=3 poweroff.wait_ms=5"
timeout_secs = 60
cpus = 4
stdin = ["shutdown"]

[expect]
exit = 0
serial_contains = [
    "power: poweroff.wait_ms=5 refused: 500 to 60000 ms; 3000 kept",
    "AriCodeOS: poweroff_from: the call moved to CPU 3",
    "AriCodeOS: the power-off runs on CPU 0 (called on CPU 3)",
    "AriCodeOS: the other CPUs are halted for the power-off",
]
serial_order = [
    "AriCodeOS: shutting down",
    "ARICODEOS_SHUTDOWN",
    "AriCodeOS: poweroff_from: the call moved to CPU 3",
    "AriCodeOS: the power-off runs on CPU 0 (called on CPU 3)",
    "AriCodeOS: the other CPUs are halted for the power-off",
]
serial_absent = ["KERNEL PANIC", "ACPI power-off had no effect", "not every other CPU halted in time"]
