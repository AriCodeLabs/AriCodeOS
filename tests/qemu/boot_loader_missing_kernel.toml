# Fault injection: the ESP does not contain kernel.elf.
name = "boot.loader_missing_kernel"
description = "no kernel.elf -> AriBoot fails in a controlled way"
level = "full"
areas = ["boot"]
cmdline = "qemu_exit"

# No slots: these scenarios exercise the ESP path.
disk = "esp-only"

[inject]
remove_kernel = true

[expect]
exit = 35
serial_contains = ["could not read"]
serial_absent = ["ARICODEOS_KERNEL_READY"]
