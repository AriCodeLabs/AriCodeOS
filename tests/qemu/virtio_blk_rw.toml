# Phase 18: init claims the virtio-blk through the PCI root (BARs probed, MSI-X
# programmed) and launches the user-space driver, which negotiates over the modern
# interface, creates the queue in DMA memory and reads and writes test disk sectors.
name = "virtio.blk_rw"
description = "virtio-blk driver in ring 3: negotiation, DMA queue, MSI-X, read and write"
level = "full"
areas = ["virtio", "drivers", "init"]
cmdline = "qemu_exit"

[expect]
exit = 33
serial_contains = [
    "pci: 00:02.0 1af4:1042 class 01.00 storage",
    "claimed (MSI-X entry 0)",
    "virtio-blk: device ready",
    "virtio-blk: capacity 98304 sectors",
    "virtio-blk: GPT with 5 partition(s)",
    "virtio-blk: serving requests",
    "AriInit: block service ok",
    "ARICODEOS_KERNEL_READY",
]
# USER FAULT appears because init deliberately kills kernel_read and crashy_driver.
serial_absent = ["KERNEL PANIC", "initialization failed"]
