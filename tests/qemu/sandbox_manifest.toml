# Phase 28: the shell cannot create processes; it asks the broker (init) to launch
# programs. hello_app ships a manifest (system, fs, 128K): it gets a read-only
# clock, a private directory in fsd and a memory quota; it cannot see other
# apps' files. A program without a manifest only gets the console and the clock.
# Regressions from audit 2026-09-27-sdk-28e745a: after 300 failed launches
# the broker has not leaked handles (the later `run hello_app 9`
# works; previously the 256-entry table ran out) and permissions::granted skips the
# gaps left by giving up a permission (perms_check). A program asking for
# the raw keyboard (`input`) is denied (ADR 0053).
name = "sandbox.manifest"
description = "capability broker: manifest, private directory, quota and denial"
level = "full"
areas = ["sandbox", "shell", "filesystem", "init"]
cmdline = "qemu_exit shell"
timeout_secs = 300
stdin = [
    "run hello_app 7",
    "run hello_app 8",
    "run blk_client",
    "run no-existe",
    "run perms_check",
    "repeat 300 run no-existe",
    "run hello_app 9",
    "run fs_victim",
    "run fs_probe",
    "repeat 300 run win_probe",
    "run input_client",
    "run hello_app 10",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "AriInit: launch hello_app with manifest [system fs] memory 128 KiB",
    "fsd: private directory 'hello_app'",
    "hello_app: capabilities: process(0x10001) thread(0x10002) console(0x10003) system(0x10004) endpoint(0x10005) hardware(0x10006)",
    "hello_app: uptime ",
    "hello_app: random ",
    "hello_app: private file 'notas' written and read",
    "hello_app: private ls: notas",
    "hello_app: memory quota enforced (Limit)",
    "run: hello_app exited with 0",
    "AriInit: launch blk_client without manifest [system] memory 64 KiB",
    "run: blk_client exited with 2",
    "run: no-existe: not found in the initrd",
    "perms_check: at start: system endpoint hardware",
    "perms_check: without system: endpoint hardware",
    "perms_check: without endpoint: hardware",
    "perms_check: enumeration skips gaps ok",
    "run: perms_check exited with 0",
    "hello_app: hello from an SDK app (arg 9)",
    "fs_victim: secret written, descriptor left open on exit",
    "fs_probe: foreign descriptors inaccessible (BadFd on 16 x read, write and close)",
    "fs_probe: replace after an abandoned transaction ok (journal released with its owner)",
    "fs_probe: journal does not leak foreign data (incomplete commit rejected)",
    "run: fs_probe exited with 0",
    "run: win_probe: denied by the broker",
    "AriInit: denied, requests system capabilities: input",
    "run: input_client: denied by the broker",
    "hello_app: hello from an SDK app (arg 10)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "veo files ajenos", "pude abrir", "quota was not enforced", "un hueco oculto", "the broker could not launch it", "ACCESO CRUZADO", "COMPROMISO INCOMPLETO", "RESTOS DEL JOURNAL"]
