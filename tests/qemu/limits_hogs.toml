# Stage 3 (quotas and saturation, ADR 0015): three CPU-burning programs
# in the background (`spawn`) while, in the fourth broker slot, a
# program that exhausts its handle table gets `Limit` and only affects
# itself, and another application launches, uses fsd and exits; the fourth hog takes the
# last slot and the fifth is rejected predictably; the shell keeps
# responding. A single CPU on purpose: it is the hard case for round-robin
# scheduling.
name = "limits.hogs"
description = "CPU and handle saturation: observable limits and another app keeps making progress (1 CPU)"
level = "full"
areas = ["limits", "sandbox", "shell", "init"]
cmdline = "qemu_exit shell"
cpus = 1
timeout_secs = 240
stdin = [
    "spawn cpu_hog",
    "spawn cpu_hog",
    "spawn cpu_hog",
    "run handle_hog",
    "run hello_app 7",
    "spawn cpu_hog",
    "spawn cpu_hog",
    "ps",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "spawn: cpu_hog launched in the background",
    "cpu_hog: burning CPU",
    "spawn: cpu_hog: running program limit reached (4)",
    "handle_hog: handle limit reached (Limit) after creating 252 endpoints",
    "handle_hog: table freed, creation works again ok",
    "run: handle_hog exited with 0",
    "hello_app: hello from an SDK app (arg 7)",
    "hello_app: private file 'notas' written and read",
    "hello_app: memory quota enforced (Limit)",
    "run: hello_app exited with 0",
    "running     cpu_hog",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "init no responde", "handle_hog: unexpected error"]
