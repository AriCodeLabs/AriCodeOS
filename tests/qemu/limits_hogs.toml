# Etapa 3 (cuotas y saturacion, ADR 0015): tres programas que consumen CPU
# en segundo plano (`spawn`) mientras, en la cuarta ranura del broker, un
# programa que agota su tabla de handles recibe `Limit` y solo se afecta a si
# mismo, y otra aplicacion se lanza, usa fsd y termina; el cuarto hog ocupa la
# ultima ranura y el quinto se rechaza de forma predecible; el shell sigue
# respondiendo. Una sola CPU a proposito: es el caso duro para el reparto por
# turnos.
name = "limits.hogs"
description = "saturacion de CPU y handles: limites observables y otra app sigue progresando (1 CPU)"
level = "full"
areas = ["limits", "sandbox", "shell", "init"]
cmdline = "qemu_exit shell"
cpus = 1
timeout_secs = 240
stdin = [
    "spawn cpu_hog",
    "spawn cpu_hog",
    "spawn cpu_hog",
    "run handle_hog",
    "run hello_app 7",
    "spawn cpu_hog",
    "spawn cpu_hog",
    "ps",
    "shutdown",
]

[expect]
exit = 33
serial_contains = [
    "spawn: cpu_hog lanzado en segundo plano",
    "cpu_hog: consumiendo CPU",
    "spawn: cpu_hog: limite de programas en marcha (4)",
    "handle_hog: limite de handles alcanzado (Limit) tras crear 252 endpoints",
    "handle_hog: tabla liberada, se puede seguir creando ok",
    "run: handle_hog termino con 0",
    "hello_app: hola desde una aplicacion del SDK (arg 7)",
    "hello_app: fichero privado 'notas' escrito y leido",
    "hello_app: cuota de memoria respetada (Limit)",
    "run: hello_app termino con 0",
    "activo      cpu_hog",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "USER STACK OVERFLOW", "init no responde", "handle_hog: error inesperado"]
