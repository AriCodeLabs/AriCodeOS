# Phase 25 (part two): on a normal boot init launches usb_input for the
# xHCI in addition to the virtio-input drivers, and the input service ends up
# with three devices.
name = "usb.hid_boot"
description = "normal boot with xHCI: init launches usb_input alongside the virtio-input drivers"
level = "full"
areas = ["usb", "input", "init"]
cmdline = "qemu_exit"
usb_hid = true
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "class 0c.03",
    "usb-input: device ready: USB HID Keyboard+Mouse",
    "input_client: device 2: USB HID Keyboard+Mouse",
    "AriInit: input service ok",
    "AriInit: boot services completed",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "xHCI initialization failed"]
