# Audit 6ee19fb, finding 4: a service that starts but never answers
# its probe. When it times out, the supervisor terminates it (process_kill) and waits for
# the kernel to reap it before relaunching; once the budget is exhausted no
# process of its own is left alive holding resources.
name = "services.start_timeout"
description = "supervisor: unresponsive service, terminated by the supervisor when the probe times out; no process left alive"
level = "full"
areas = ["services", "init", "user"]
cmdline = "qemu_exit service_hang"
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "hang_service: started, with no intention of answering",
    "'hang_service' killed: stopped by the supervisor",
    "AriInit: service hang_service never became ready; restart in",
    "AriInit: service hang_service never became ready; restart budget exhausted: system degraded",
    "AriInit: hang_service: 0 process(es) alive after exhausting the budget",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "no debia llegar a servir", "no llego a failed", "no responde ni termina"]
