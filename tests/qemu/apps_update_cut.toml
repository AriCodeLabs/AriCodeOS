# Stage 4 (ADR 0018): power cut while the installer is replacing the
# package. On the next boot the installed package is either the old or the new version
# (never a mix) and it launches; the installer finishes the update.
name = "apps.update_cut"
description = "power cut while installing a package: the installed one still launches and the update completes afterwards"
level = "full"
areas = ["apps", "update", "filesystem", "shell"]
install = ["examples/hello_ext"]
packages = ["examples/hello_ext:2"]
timeout_secs = 180

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["run installer"]
kill_on = "installer: installing hello_ext version 2"
[boots.expect]
killed = true
serial_contains = ["installer: installing hello_ext version 2"]
serial_absent = ["KERNEL PANIC"]

[[boots]]
cmdline = "qemu_exit shell"
stdin = ["run hello_ext 7", "run installer", "run hello_ext 8", "shutdown"]
[boots.expect]
exit = 33
serial_contains = [
    "fsd: AriFS mounted",
    ": hello from outside the tree (arg 7)",
    "run: hello_ext exited with 0",
    "run: installer exited with 0",
    "hello_ext v2: hello from outside the tree (arg 8)",
    "ARICODEOS_SHUTDOWN",
]
serial_absent = ["KERNEL PANIC", "AriFS corrupto", "no verifica", "denied", "installer: error"]
