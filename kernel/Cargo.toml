[package]
name = "arikernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriKernel: núcleo de AriCodeOS"

[[bin]]
name = "arikernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
boot-protocol = { path = "../boot-protocol" }
aricode-cmdline = { path = "../libs/cmdline" }
aricode-fb-console = { path = "../libs/fb-console" }
aricode-x86-cpu = { path = "../libs/x86-cpu" }
aricode-pmm = { path = "../libs/pmm" }
aricode-x86-paging = { path = "../libs/x86-paging" }
aricode-heap = { path = "../libs/heap" }
aricode-sync = { path = "../libs/sync" }
aricode-sched = { path = "../libs/sched" }
aricode-abi = { path = "../sdk/abi" }
aricode-handles = { path = "../libs/handles" }
aricode-elf = { path = "../libs/elf" }
aricode-initrd = { path = "../libs/initrd" }
aricode-acpi = { path = "../libs/acpi" }
aricode-pci = { path = "../libs/pci" }
aricode-crypto = { path = "../libs/crypto" }
aricode-iommu = { path = "../libs/iommu" }
aricode-input = { path = "../libs/input" }
log = { version = "0.4", default-features = false }
