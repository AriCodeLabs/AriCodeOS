[package]
name = "arikernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriKernel: núcleo de AriCodeOS"

[[bin]]
name = "arikernel"
path = "src/main.rs"
test = false
bench = false

[features]
