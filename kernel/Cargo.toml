[package]
name = "arikernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriKernel: núcleo de AriCodeOS"

[[bin]]
name = "arikernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
boot-protocol = { path = "../boot-protocol" }
aricode-cmdline = { path = "../libs/cmdline" }
aricode-fb-console = { path = "../libs/fb-console" }
aricode-x86-cpu = { path = "../libs/x86-cpu" }
aricode-pmm = { path = "../libs/pmm" }
aricode-x86-paging = { path = "../libs/x86-paging" }
log = { version = "0.4", default-features = false }
