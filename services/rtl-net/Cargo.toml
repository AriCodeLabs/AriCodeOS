[package]
name = "ari-rtl-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ring 3 Realtek r8169 (RTL8169/8168/8101) driver and network service on top of ari-net-core"

[[bin]]
name = "rtl_net"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
ari-net-core = { path = "../net-core" }
aricode-rtl8169 = { path = "../../libs/rtl8169" }
aricode-net = { path = "../../libs/net" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
