[package]
name = "ari-virtio-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space virtio-net driver and network service (ARP, IPv4, ICMP, UDP, DHCP, DNS)"
publish = false

[[bin]]
name = "virtio_net"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
ari-net-core = { path = "../net-core" }
aricode-virtio = { path = "../../libs/virtio" }
aricode-proto = { path = "../../sdk/proto" }
aricode-net = { path = "../../libs/net" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
