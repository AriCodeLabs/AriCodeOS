[package]
name = "ari-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "arish: first interactive AriCodeOS shell (ring 3)"
publish = false

[[bin]]
name = "shell"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-net = { path = "../../libs/net" }
aricode-proto = { path = "../../sdk/proto" }
aricode-lineedit = { path = "../../libs/lineedit" }
aricode-https = { path = "../../sdk/https" }
aricode-tls = { path = "../../libs/tls" }
aricode-x509 = { path = "../../libs/x509" }
aricode-update-index = { path = "../../libs/update-index" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
