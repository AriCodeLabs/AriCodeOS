[package]
name = "ari-virtio-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space virtio-input driver (keyboard, mouse) and input event service"
publish = false

[[bin]]
name = "virtio_input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
