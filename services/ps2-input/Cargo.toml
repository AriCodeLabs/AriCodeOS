[package]
name = "ari-ps2-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space PS/2 keyboard and pointer decoder and input event service"
publish = false

[[bin]]
name = "ps2_input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
