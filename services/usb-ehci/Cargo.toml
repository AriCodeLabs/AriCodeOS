[package]
name = "ari-usb-ehci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EHCI (USB 2.0) driver with hubs, USB HID keyboard/mouse (boot protocol) and bulk-only mass storage, in user space"
publish = false

[[bin]]
name = "usb_ehci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-ehci = { path = "../../libs/ehci" }
aricode-xhci = { path = "../../libs/xhci" }
aricode-usb-storage = { path = "../../libs/usb-storage" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-cmdline = { path = "../../libs/cmdline" }
aricode-gpt = { path = "../../libs/gpt" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
