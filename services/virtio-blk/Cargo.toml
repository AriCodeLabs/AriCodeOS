[package]
name = "ari-virtio-blk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space virtio-blk driver"
publish = false

[[bin]]
name = "virtio_blk"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-virtio = { path = "../../libs/virtio" }
aricode-proto = { path = "../../sdk/proto" }
aricode-gpt = { path = "../../libs/gpt" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
