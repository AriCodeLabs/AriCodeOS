[package]
name = "ariinit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriInit: first user process; launches and supervises services"
publish = false

[[bin]]
name = "init"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-manifest = { path = "../../libs/manifest" }
aricode-proto = { path = "../../sdk/proto" }
aricode-gpt = { path = "../../libs/gpt" }
aricode-cmdline = { path = "../../libs/cmdline" }
aricode-input = { path = "../../libs/input" }
aricode-ab = { path = "../../libs/ab" }
aricode-fat = { path = "../../libs/fat" }
aricode-supervisor = { path = "../../libs/supervisor" }
aricode-pkg = { path = "../../libs/pkg" }
aricode-crypto = { path = "../../libs/crypto" }
aricode-update-index = { path = "../../libs/update-index", features = ["client"] }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
