[package]
name = "ariinit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriInit: primer proceso de usuario; lanza y supervisa servicios"
publish = false

[[bin]]
name = "init"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-manifest = { path = "../../libs/manifest" }
aricode-proto = { path = "../../sdk/proto" }
aricode-gpt = { path = "../../libs/gpt" }
aricode-ab = { path = "../../libs/ab" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
