[package]
name = "ari-fsd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space AriFS file service"
publish = false

[[bin]]
name = "fsd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-arifs = { path = "../../libs/arifs" }
aricode-faults = { path = "../../libs/faults" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
