[package]
name = "ari-usb-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "xHCI driver and USB HID keyboard/mouse (boot protocol) with an input event service, in user space"
publish = false

[[bin]]
name = "usb_input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-xhci = { path = "../../libs/xhci" }
aricode-usb-storage = { path = "../../libs/usb-storage" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-cmdline = { path = "../../libs/cmdline" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
