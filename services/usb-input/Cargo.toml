[package]
name = "ari-usb-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Driver xHCI y teclado/raton USB HID (protocolo de arranque) con servicio de eventos de entrada, en espacio de usuario"
publish = false

[[bin]]
name = "usb_input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-xhci = { path = "../../libs/xhci" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
