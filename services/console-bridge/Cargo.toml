[package]
name = "ari-console-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS console bridge: forwards key presses from user-space keyboards (virtio, USB HID) to the kernel console input ring"
publish = false

[[bin]]
name = "console_bridge"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-input = { path = "../../libs/input" }
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
