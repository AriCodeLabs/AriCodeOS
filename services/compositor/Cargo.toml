[package]
name = "ari-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS user-space window compositor"
publish = false

[[bin]]
name = "compositor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-sys = { path = "../../sdk/rust" }
aricode-proto = { path = "../../sdk/proto" }
aricode-cmdline = { path = "../../libs/cmdline" }
aricode-gfx = { path = "../../libs/gfx" }
aricode-input = { path = "../../libs/input" }
aricode-faults = { path = "../../libs/faults" }
aricode-rt = { path = "../../sdk/runtime" }
aricode-text = { path = "../../libs/text" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
