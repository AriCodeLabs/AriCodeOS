# Crates with host unit tests (`cargo xtask test --level unit`).
default-members = [
    "boot-protocol",
    "libs/elf",
    "libs/x86-paging",
    "libs/cmdline",
    "libs/fb-console",
    "libs/x86-cpu",
    "libs/pmm",
    "libs/heap",
    "libs/sync",
    "libs/sched",
    "libs/handles",
    "libs/initrd",
    "libs/acpi",
    "libs/pci",
    "libs/virtio",
    "libs/gpt",
    "libs/arifs",
    "libs/iommu",
    "libs/fat",
    "libs/xhci",
    "libs/usb-storage",
    "libs/ehci",
    "libs/lineedit",
    "libs/ssh",
    "libs/rtl8169",
    "libs/supervisor",
    "libs/update-index",
    "sdk/abi",
    "sdk/rust",
    "sdk/proto",
    "tools/xtask",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Edwin F. Veliz Jaramillo (lynxcraft) and AriCodeOS contributors"]
homepage = "https://www.aricodeos.org/"
repository = "https://github.com/AriCodeLabs/AriCodeOS"

# Profiles shared by the bootloader and the kernel.
# panic = "abort": there is no unwinding in no_std.
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = true
