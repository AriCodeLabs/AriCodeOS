[workspace]
resolver = "2"
members = [
    "boot-protocol",
    "libs/elf",
    "libs/x86-paging",
    "libs/cmdline",
    "libs/fb-console",
    "libs/x86-cpu",
    "libs/pmm",
    "libs/heap",
    "libs/sync",
    "libs/sched",
    "libs/handles",
    "libs/initrd",
    "libs/acpi",
    "libs/pci",
    "libs/virtio",
    "libs/gpt",
    "libs/arifs",
    "libs/net",
    "libs/http",
    "libs/input",
    "libs/gfx",
    "libs/manifest",
    "libs/pkg",
    "libs/wasm",
    "libs/crypto",
    "libs/ab",
    "libs/iommu",
    "libs/fat",
    "libs/xhci",
    "libs/supervisor",
    "sdk/abi",
    "sdk/runtime",
    "sdk/build",
    "apps/hello",
    "apps/perms-check",
    "apps/updater",
    "apps/fs-probe",
    "apps/win-probe",
    "apps/wasm-runner",
    "apps/wasm-demo",
    "apps/notes-reader",
    "apps/installer",
    "apps/bench",
    "sdk/rust",
    "sdk/proto",
    "user/testprogs",
    "services/init",
    "services/virtio-blk",
    "services/virtio-net",
    "services/virtio-input",
    "services/usb-input",
    "services/console-bridge",
    "services/compositor",
    "services/arifs",
    "services/shell",
    "boot",
    "kernel",
    "tools/xtask",
]

# Crates con tests unitarios de host (`cargo xtask test --level unit`).
default-members = [
    "boot-protocol",
    "libs/elf",
    "libs/x86-paging",
    "libs/cmdline",
    "libs/fb-console",
    "libs/x86-cpu",
    "libs/pmm",
    "libs/heap",
    "libs/sync",
    "libs/sched",
    "libs/handles",
    "libs/initrd",
    "libs/acpi",
    "libs/pci",
    "libs/virtio",
    "libs/gpt",
    "libs/arifs",
    "libs/iommu",
    "libs/fat",
    "libs/xhci",
    "libs/supervisor",
    "sdk/abi",
    "sdk/rust",
    "sdk/proto",
    "tools/xtask",
]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/lynxcraft/aricodeos"

# Perfiles compartidos por bootloader y kernel.
# panic = "abort": no hay unwinding en no_std.
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = true
