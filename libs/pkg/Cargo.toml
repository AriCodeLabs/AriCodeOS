[package]
name = "aricode-pkg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS signed application packages: container with program, application manifest and Ed25519 signature (no_std; writer behind the write feature)"

[lib]
path = "src/lib.rs"

[features]
default = []
# Writer for host tools (xtask).
write = ["aricode-initrd/write"]

[dependencies]
aricode-crypto = { path = "../crypto" }
aricode-proto = { path = "../../sdk/proto" }
aricode-initrd = { path = "../initrd" }

[dev-dependencies]
aricode-initrd = { path = "../initrd", features = ["write"] }
# The tests build packages: plain `cargo test -p aricode-pkg` turns the
# writer on, as `--features write` did (audit of ADR 0074 phase A).
aricode-pkg = { path = ".", features = ["write"] }
