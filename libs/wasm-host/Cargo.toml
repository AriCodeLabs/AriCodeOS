[package]
name = "aricode-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS WebAssembly host policy over wasmi: profile, limits, fuel prices, manifest and Capability API signatures (ADR 0071)"

[lib]
path = "src/lib.rs"

[dependencies]
# ADR 0071: the interpreter, with its validator (wasmparser). `auto-dispatch`
# keeps the dispatch loop in unoptimized builds: its tail-call dispatch,
# which optimized builds use, grows the stack per instruction without the
# optimizer (the host tests overflowed).
wasmi = { version = "=2.0.0", default-features = false, features = ["validate", "memory64", "auto-dispatch"] }
# The nesting check before wasmi sees a module (audit of ADR 0071, M1).
wasmparser = { version = "=0.228.0", default-features = false }

[dev-dependencies]
# Test modules written as text (host tests only).
wat = "=1.228.0"
