[package]
name = "aricode-ab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Actualización A/B de AriCodeOS: estado de arranque, imágenes de sistema firmadas y decisión de slot (no_std)"

[lib]
path = "src/lib.rs"

[dependencies]
aricode-crypto = { path = "../crypto" }
aricode-initrd = { path = "../initrd" }

[dev-dependencies]
aricode-initrd = { path = "../initrd", features = ["write"] }
