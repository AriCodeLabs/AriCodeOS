[package]
name = "aricode-ab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS A/B update: boot state, signed system images and slot decision (no_std)"

[lib]
path = "src/lib.rs"

[dependencies]
aricode-crypto = { path = "../crypto" }
aricode-initrd = { path = "../initrd" }

[dev-dependencies]
aricode-initrd = { path = "../initrd", features = ["write"] }
