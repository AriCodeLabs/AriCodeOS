[package]
name = "aricode-update-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS update sources and signed update index (ADR 0029): index format, Ed25519 verification, rollback and downgrade rules, source list (no_std + alloc)"

[lib]
path = "src/lib.rs"

[dependencies]
aricode-ab = { path = "../ab" }
aricode-crypto = { path = "../crypto" }
aricode-pkg = { path = "../pkg" }
# The file client's side (`client`): user-space programs only.
aricode-sys = { path = "../../sdk/rust", optional = true }
aricode-proto = { path = "../../sdk/proto", optional = true }

[features]
client = ["dep:aricode-sys", "dep:aricode-proto"]
