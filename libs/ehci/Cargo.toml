[package]
name = "aricode-ehci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EHCI (USB 2.0) structures: registers, queue heads, qTDs, periodic schedule, legacy handoff and USB 2.0 hubs (no_std, host tests)"

[lib]
path = "src/lib.rs"

[dependencies]
