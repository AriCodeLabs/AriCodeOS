# Phase 33: a test driver is handed the virtio-blk, reads a sector into its
# (translated) buffer and then tells the device to write to memory it does not
# own: the unit blocks it and records the fault; the domain is released with
# the process.
name = "audit.iommu_reassignment"
description = "test=iommu: legitimate DMA translated, DMA to foreign memory blocked and logged, domain released"
level = "full"
areas = ["audit_iommu"]
cmdline = "qemu_exit test=iommu"
timeout_secs = 40

[expect]
exit = 33
serial_contains = [
    "iommu: 00:02.0 asignado al dominio",
    "en el dominio identidad",
    "iommu: fallo DMA de 00:02.0 (escritura en 0x1000):",
    "dma_rogue: lectura legitima ok, DMA a memoria ajena bloqueado (",
    "iommu selftest ok (lectura legitima traducida, DMA a memoria ajena bloqueado con",
    "y la memoria intacta, dominio liberado)",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "USER FAULT"]
