# Fase 25 (segunda parte): en el arranque normal init lanza usb_input para el
# xHCI ademas de los drivers virtio-input, y el servicio de entrada queda
# con tres dispositivos.
name = "audit.usb_legacy"
description = "arranque normal con xHCI: init lanza usb_input junto a los virtio-input"
level = "full"
areas = ["audit_usb_legacy"]
cmdline = "qemu_exit"
usb_hid = true
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "clase 0c.03",
    "usb-input: dispositivo listo: USB HID Keyboard+Mouse",
    "input_client: dispositivo 2: USB HID Keyboard+Mouse",
    "AriInit: servicio de entrada ok",
    "AriInit: servicios de arranque completados",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "fallo en la inicializacion del xHCI"]
