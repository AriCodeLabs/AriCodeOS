# Phase 25 (part two): on a normal boot init launches usb_input for the
# xHCI in addition to the virtio-input drivers, and the input service ends up
# with three devices.
name = "audit.usb_legacy"
description = "normal boot with xHCI: init launches usb_input alongside the virtio-input drivers"
level = "full"
areas = ["audit_usb_legacy"]
cmdline = "qemu_exit"
usb_hid = true
timeout_secs = 90

[expect]
exit = 33
serial_contains = [
    "clase 0c.03",
    "usb-input: dispositivo listo: USB HID Keyboard+Mouse",
    "input_client: dispositivo 2: USB HID Keyboard+Mouse",
    "AriInit: servicio de entrada ok",
    "AriInit: servicios de arranque completados",
    "ARICODEOS_KERNEL_READY",
]
serial_absent = ["KERNEL PANIC", "fallo en la inicializacion del xHCI"]
