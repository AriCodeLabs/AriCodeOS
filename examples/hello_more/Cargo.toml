# A second external application, so that a profile (ADR 0074) installs
# more than one package in the tests. Built like `hello_ext`.
[package]
name = "hello-more"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Second example external AriCodeOS application, for profiles"
publish = false

[[bin]]
name = "hello_more"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
