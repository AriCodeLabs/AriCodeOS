# Aplicacion construida fuera del arbol de AriCodeOS: su propio workspace,
# el SDK por ruta y la misma cadena de herramientas (rust-toolchain.toml y
# .cargo/config.toml del repositorio se aplican al construir desde su raiz
# con `cargo xtask app-pack examples/hello_ext`).
[package]
name = "hello-ext"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ejemplo de aplicacion externa de AriCodeOS instalada en AriFS"
publish = false

[[bin]]
name = "hello_ext"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
