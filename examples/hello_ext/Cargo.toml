# Application built outside the AriCodeOS tree: its own workspace, the SDK
# by path and the same toolchain (the repository's rust-toolchain.toml and
# .cargo/config.toml apply when building from its root with
# `cargo xtask app-pack examples/hello_ext`).
[package]
name = "hello-ext"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Example external AriCodeOS application installed on AriFS"
publish = false

[[bin]]
name = "hello_ext"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
