[package]
name = "ari-app-wasm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS WebAssembly runtime: runs a module from its private directory with the Capability API (wasmi)"
publish = false

[[bin]]
name = "wasm_runner"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-wasm-host = { path = "../../libs/wasm-host" }
# ADR 0071: the interpreter (features as in aricode-wasm-host).
wasmi = { version = "=2.0.0", default-features = false, features = ["validate", "memory64", "auto-dispatch"] }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
