[package]
name = "ari-app-wasm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS WebAssembly runtime: runs a module from its private directory with the Capability API"
publish = false

[[bin]]
name = "wasm_runner"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-wasm = { path = "../../libs/wasm" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
