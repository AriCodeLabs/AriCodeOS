[package]
name = "ari-app-wasm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime WebAssembly de AriCodeOS: ejecuta un modulo de su directorio privado con la Capability API"
publish = false

[[bin]]
name = "wasm_runner"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-wasm = { path = "../../libs/wasm" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
