[package]
name = "ari-app-fs-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fsd isolation regression: one app leaves a descriptor open and another tries to use it"
publish = false

[[bin]]
name = "fs_victim"
path = "src/victim.rs"
test = false
bench = false

[[bin]]
name = "fs_probe"
path = "src/probe.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-proto = { path = "../../sdk/proto" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
