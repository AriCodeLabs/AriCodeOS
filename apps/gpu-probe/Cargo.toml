[package]
name = "ari-app-gpu-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stage A of ADR 0080 (ADR 0083): fill and copy with the GPU's blitter, timed beside the CPU, a hung batch reset, and what non-secure batches can reach"
publish = false

[[bin]]
name = "gpu_probe"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-intel-gt = { path = "../../libs/intel-gt" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
