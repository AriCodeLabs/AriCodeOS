[package]
name = "ari-app-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS signed package installer: trusted app that installs or updates apps/NAME.aripkg from pkgs/ with an atomic replace"
publish = false

[[bin]]
name = "installer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-pkg = { path = "../../libs/pkg" }
aricode-crypto = { path = "../../libs/crypto" }
aricode-update-index = { path = "../../libs/update-index" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
