[package]
name = "ari-app-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instalador de paquetes firmados de AriCodeOS: aplicacion de confianza que instala o actualiza apps/NOMBRE.aripkg desde pkgs/ con un reemplazo atomico"
publish = false

[[bin]]
name = "installer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-pkg = { path = "../../libs/pkg" }
aricode-crypto = { path = "../../libs/crypto" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
