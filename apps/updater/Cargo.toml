[package]
name = "ari-app-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Actualizador A/B de AriCodeOS: verifica la imagen de UPDATE y la instala en el slot inactivo"
publish = false

[[bin]]
name = "updater"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-gpt = { path = "../../libs/gpt" }
aricode-ab = { path = "../../libs/ab" }
aricode-crypto = { path = "../../libs/crypto" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
