[package]
name = "ari-app-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS update client: signed indexes from the owner's sources, A/B system images and app packages, verified before any write (ADR 0027, ADR 0029)"
publish = false

[[bin]]
name = "updater"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-gpt = { path = "../../libs/gpt" }
aricode-ab = { path = "../../libs/ab" }
aricode-cmdline = { path = "../../libs/cmdline" }
aricode-crypto = { path = "../../libs/crypto" }
aricode-https = { path = "../../sdk/https" }
aricode-proto = { path = "../../sdk/proto" }
aricode-pkg = { path = "../../libs/pkg" }
aricode-update-index = { path = "../../libs/update-index" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
