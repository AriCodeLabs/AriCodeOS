[package]
name = "ari-app-notes-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AriCodeOS SDK sample app: reads a file shared read-only by the broker"
publish = false

[[bin]]
name = "notes_reader"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aricode-rt = { path = "../../sdk/runtime" }
aricode-proto = { path = "../../sdk/proto" }

[build-dependencies]
aricode-build = { path = "../../sdk/build" }
