[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
aricode-initrd = { path = "../../libs/initrd", features = ["write"] }
aricode-gpt = { path = "../../libs/gpt", features = ["write"] }
aricode-arifs = { path = "../../libs/arifs" }
aricode-net = { path = "../../libs/net" }
aricode-http = { path = "../../libs/http" }
aricode-proto = { path = "../../sdk/proto" }
aricode-crypto = { path = "../../libs/crypto" }
aricode-ab = { path = "../../libs/ab" }
